<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>آرشیو سرای ترجمه</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    :root {
      --bg: #f4f6f9;
      --secondary-bg: #ffffff;
      --text: #1e293b;
      --hint: #64748b;
      --accent: #1d4ed8;
      --accent-text: #ffffff;
      --border: rgba(148, 163, 184, 0.25);
      --card-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
      --group-bg: rgba(29, 78, 216, 0.06);
      --group-border: rgba(29, 78, 216, 0.22);
      --summary-bg: rgba(148, 163, 184, 0.09);
      --btn-x-bg: #0f172a;
      --btn-x-text: #ffffff;
      --radius: 14px;
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --secondary-bg: #1e293b;
      --text: #f1f5f9;
      --hint: #94a3b8;
      --accent: #3b82f6;
      --accent-text: #ffffff;
      --border: rgba(148, 163, 184, 0.16);
      --card-shadow: 0 2px 10px rgba(0, 0, 0, 0.25);
      --group-bg: rgba(59, 130, 246, 0.12);
      --group-border: rgba(59, 130, 246, 0.3);
      --summary-bg: rgba(255, 255, 255, 0.05);
      --btn-x-bg: #f1f5f9;
      --btn-x-text: #0f172a;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.7;
      padding-bottom: 78px;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.2s, color 0.2s;
    }

    body.reading-mode {
      padding-bottom: 24px;
      background-color: var(--secondary-bg);
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 14px 16px;
    }

    /* Top Bar (Breadcrumbs + Theme Toggle) */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 14px;
      background: var(--secondary-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      white-space: nowrap;
      font-size: 0.8rem;
      color: var(--hint);
      scrollbar-width: none;
      flex: 1;
    }
    .breadcrumbs::-webkit-scrollbar { display: none; }
    .crumb-item {
      cursor: pointer;
      color: var(--accent);
      font-weight: 500;
    }
    .crumb-item.current {
      color: var(--text);
      cursor: default;
      font-weight: 600;
    }
    .crumb-sep {
      color: var(--hint);
      opacity: 0.6;
      user-select: none;
    }

    .theme-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }
    .theme-btn:active { opacity: 0.7; }
    .theme-btn svg { width: 18px; height: 18px; }

    /* Home Top Search + Theme Row */
    .home-top-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .home-top-row .search-box {
      flex: 1;
      margin-bottom: 0;
    }
    .home-top-row .theme-btn {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: var(--secondary-bg);
    }

    /* Search Input */
    .search-box {
      position: relative;
      margin-bottom: 16px;
    }
    .search-box input {
      width: 100%;
      padding: 12px 42px 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--secondary-bg);
      color: var(--text);
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus {
      border-color: var(--accent);
    }
    .search-box svg {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--hint);
      pointer-events: none;
    }

    /* Slider */
    .slider-wrap {
      margin-bottom: 18px;
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
      background: var(--secondary-bg);
      border: 1px solid var(--border);
    }
    .slider-track {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .slider-track::-webkit-scrollbar { display: none; }
    .slider-item {
      min-width: 100%;
      scroll-snap-align: start;
      display: block;
    }
    .slider-item img {
      width: 100%;
      height: 165px;
      object-fit: cover;
      display: block;
    }

    /* Home Grid Buttons */
    .home-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .home-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .home-btn {
      background: var(--secondary-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 14px;
      text-align: center;
      font-family: inherit;
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      box-shadow: var(--card-shadow);
      transition: transform 0.15s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 76px;
    }
    .home-btn:active {
      transform: scale(0.98);
      border-color: var(--accent);
    }
    .home-btn.primary {
      background: linear-gradient(135deg, #1d4ed8, #1e3a8a);
      color: #ffffff;
      border: none;
      min-height: 88px;
      font-size: 1.05rem;
    }

    /* Page Header */
    .page-header {
      text-align: center;
      padding: 10px 0 18px;
    }
    .page-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
    }
    .social-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .social-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      border: none;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .social-btn:active { opacity: 0.8; }
    .social-btn svg { width: 15px; height: 15px; }
    .social-btn.btn-x { background: var(--btn-x-bg); color: var(--btn-x-text); }
    .social-btn.btn-yt { background: #c81e1e; color: #ffffff; }
    .social-btn.btn-fb { background: #1877f2; color: #ffffff; }

    /* Center-Aligned Teacher & Group Cards */
    .entity-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .entity-card {
      background: var(--secondary-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 14px;
      text-align: center;
      cursor: pointer;
      box-shadow: var(--card-shadow);
      transition: transform 0.15s, border-color 0.2s;
    }
    .entity-card:active {
      transform: scale(0.99);
      border-color: var(--accent);
    }
    .entity-card.is-group {
      background: var(--group-bg);
      border: 1px solid var(--group-border);
    }
    .entity-avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 8px;
      display: block;
      border: 1px solid var(--border);
    }
    .entity-name {
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text);
    }
    .entity-meta {
      font-size: 0.78rem;
      color: var(--hint);
      margin-top: 4px;
    }
    .entity-meta.soon {
      opacity: 0.75;
    }

    /* Tabs */
    .tabs-bar {
      display: flex;
      background: var(--secondary-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 16px;
      gap: 4px;
    }
    .tab-btn {
      flex: 1;
      padding: 9px 6px;
      border: none;
      background: transparent;
      color: var(--hint);
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      border-radius: 9px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .tab-btn.active {
      background: var(--accent);
      color: var(--accent-text);
    }

    /* Content Cards */
    .cards-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .content-card {
      background: var(--secondary-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--card-shadow);
    }
    .card-title {
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.65;
    }
    .card-speaker {
      font-size: 0.8rem;
      color: var(--accent);
      margin-top: 4px;
      font-weight: 500;
    }
    .card-cat {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 10px;
      border-radius: 8px;
      background: rgba(148, 163, 184, 0.14);
      color: var(--hint);
      font-size: 0.76rem;
      font-weight: 500;
    }
    .card-summary {
      margin-top: 12px;
      padding: 10px 12px;
      border-right: 3px solid var(--accent);
      background: var(--summary-bg);
      border-radius: 6px;
      font-size: 0.84rem;
      color: var(--text);
      line-height: 1.75;
    }
    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }
    .action-btn {
      flex: 1 1 calc(50% - 8px);
      min-width: 125px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid transparent;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .action-btn:active { opacity: 0.82; transform: scale(0.98); }
    .action-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

    /* Brand & Semantic Button Colors */
    .action-btn.btn-read {
      background: #1d4ed8;
      color: #ffffff;
    }
    .action-btn.btn-pdf {
      background: #059669;
      color: #ffffff;
    }
    .action-btn.btn-yt {
      background: #c81e1e;
      color: #ffffff;
    }
    .action-btn.btn-fb {
      background: #1877f2;
      color: #ffffff;
    }
    .action-btn.btn-share {
      flex: 0 1 auto;
      min-width: 84px;
      background: var(--bg);
      color: var(--text);
      border-color: var(--border);
    }

    /* Post Card Specific */
    .post-sort-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }
    .post-sort-select {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--secondary-bg);
      color: var(--text);
      font-family: inherit;
      font-size: 0.8rem;
      outline: none;
    }
    .post-date {
      font-size: 0.78rem;
      color: var(--hint);
      margin-bottom: 6px;
    }
    .post-preview {
      font-size: 0.9rem;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.75;
    }
    .post-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    /* Reading Mode */
    .reader-wrap {
      padding: 8px 4px 20px;
    }
    .reader-title {
      font-size: 1.12rem;
      font-weight: 700;
      line-height: 1.7;
      margin-bottom: 8px;
    }
    .reader-meta {
      font-size: 0.8rem;
      color: var(--hint);
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .reader-body {
      font-size: 0.98rem;
      line-height: 2.05;
      white-space: pre-wrap;
      color: var(--text);
      text-align: justify;
    }
    .reader-footer {
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--hint);
      font-size: 0.92rem;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 62px;
      background: var(--secondary-bg);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 50;
      padding-bottom: env(safe-area-inset-bottom);
    }
    body.reading-mode .bottom-nav {
      display: none;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border: none;
      background: transparent;
      color: var(--hint);
      font-family: inherit;
      font-size: 0.74rem;
      font-weight: 500;
      cursor: pointer;
      height: 100%;
    }
    .nav-item.active {
      color: var(--accent);
      font-weight: 700;
    }
    .nav-item svg {
      width: 20px;
      height: 20px;
    }

    .section-label {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--hint);
      margin: 18px 0 10px;
    }
  </style>
</head>
<body>

  <div id="topBar" class="top-bar" style="display:none;">
    <div id="breadcrumbs" class="breadcrumbs"></div>
    <button class="theme-btn" onclick="toggleTheme()" aria-label="تغییر حالت صفحه" id="topThemeBtn"></button>
  </div>

  <main id="app" class="container">
    <div class="empty-state">در حال بارگذاری آرشیو...</div>
  </main>

  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-item active" data-nav="home" onclick="navigateRoot('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>خانه</span>
    </button>
    <button class="nav-item" data-nav="categories" onclick="navigateRoot('categories')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span>دسته‌بندی</span>
    </button>
    <button class="nav-item" data-nav="search" onclick="navigateRoot('search')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>جستجو</span>
    </button>
  </nav>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Theme Management
    const ICONS_THEME = {
      moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
      sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>'
    };

    function getInitialTheme() {
      const saved = localStorage.getItem('archive_theme');
      if (saved === 'dark' || saved === 'light') return saved;
      if (tg && tg.colorScheme === 'dark') return 'dark';
      return 'light';
    }

    let currentTheme = getInitialTheme();

    function applyTheme() {
      document.documentElement.setAttribute('data-theme', currentTheme);
      localStorage.setItem('archive_theme', currentTheme);
      const icon = currentTheme === 'dark' ? ICONS_THEME.sun : ICONS_THEME.moon;
      const topBtn = document.getElementById('topThemeBtn');
      if (topBtn) topBtn.innerHTML = icon;
      const homeBtn = document.getElementById('homeThemeBtn');
      if (homeBtn) homeBtn.innerHTML = icon;
    }

    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      applyTheme();
    }

    applyTheme();

    // Global State
    const DB = {
      config: {
        bot_username: 'STarjomehPostBot',
        app_short_name: 'archive',
        show_category_on_card: true,
        show_teacher_avatar: false,
        show_sharai: false,
        slider: { enabled: false, items: [] }
      },
      teachers: [],
      videos: [],
      books: [],
      posts: []
    };

    let navStack = [];

    const ICONS = {
      search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
      book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
      download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
      video: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
      share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>',
      x: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>',
      facebook: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 13.5h2.5l1-4H14v-2c0-1.03 0-2 2-2h1.5V2.14c-.326-.043-1.557-.14-2.857-.14C11.928 2 10 3.657 10 6.7v2.8H7v4h3V22h4v-8.5z"/></svg>',
      youtube: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>'
    };

    // Helpers
    function normalizeText(str) {
      if (!str) return '';
      return String(str)
        .replace(/ي/g, 'ی')
        .replace(/ك/g, 'ک')
        .replace(/ة/g, 'ه')
        .replace(/\u200c/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .toLowerCase();
    }

    function toPersianDigits(num) {
      return String(num).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function openExternal(url) {
      if (!url) return;
      if (tg) {
        if (url.startsWith('https://t.me/') || url.startsWith('http://t.me/')) {
          tg.openTelegramLink(url);
        } else {
          tg.openLink(url);
        }
      } else {
        window.open(url, '_blank');
      }
    }

    function shareItem(type, id, title) {
      const bot = DB.config.bot_username || 'STarjomehPostBot';
      const app = DB.config.app_short_name || 'archive';
      const deepLink = `https://t.me/${bot}/${app}?startapp=${type}_${id}`;
      const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(deepLink)}&text=${encodeURIComponent(title || '')}`;
      openExternal(shareUrl);
    }

    // Data Matching
    function getTeacherMatchNames(teacher) {
      const names = [normalizeText(teacher.name)];
      if (Array.isArray(teacher.aliases)) {
        teacher.aliases.forEach(a => names.push(normalizeText(a)));
      }
      return names;
    }

    function getTeacherAssets(teacher) {
      const matchNames = getTeacherMatchNames(teacher);
      const videos = DB.videos.filter(v => {
        if (v.teacher_id && v.teacher_id === teacher.id) return true;
        return matchNames.includes(normalizeText(v.speaker));
      });
      const books = DB.books.filter(b => {
        if (b.teacher_id && b.teacher_id === teacher.id) return true;
        return b.speaker && matchNames.includes(normalizeText(b.speaker));
      });
      const posts = DB.posts.filter(p => {
        if (p.teacher_id && p.teacher_id === teacher.id) return true;
        return p.speaker && matchNames.includes(normalizeText(p.speaker));
      });
      return { videos, books, posts };
    }

    function formatAssetCounts(assets) {
      const parts = [];
      if (assets.videos.length > 0) parts.push(`${toPersianDigits(assets.videos.length)} ویدیو`);
      if (assets.books.length > 0) parts.push(`${toPersianDigits(assets.books.length)} کتاب`);
      if (assets.posts.length > 0) parts.push(`${toPersianDigits(assets.posts.length)} پست`);
      return parts.length > 0 ? parts.join(' • ') : 'به‌زودی';
    }

    function getGroupStats(groupTeacher) {
      const children = DB.teachers.filter(t => t.parent_id === groupTeacher.id);
      let totalAssets = 0;
      children.forEach(c => {
        const a = getTeacherAssets(c);
        totalAssets += a.videos.length + a.books.length + a.posts.length;
      });
      const parts = [];
      if (children.length > 0) parts.push(`${toPersianDigits(children.length)} استاد`);
      if (totalAssets > 0) parts.push(`${toPersianDigits(totalAssets)} اثر`);
      return parts.length > 0 ? parts.join(' • ') : 'به‌زودی';
    }

    // Navigation Engine
    function updateTelegramBackButton() {
      if (!tg) return;
      if (navStack.length > 1) {
        tg.BackButton.show();
      } else {
        tg.BackButton.hide();
      }
    }

    if (tg) {
      tg.BackButton.onClick(() => goBack());
    }

    function pushView(viewState) {
      navStack.push(viewState);
      renderCurrentView();
      window.scrollTo(0, 0);
    }

    function goBack() {
      if (navStack.length > 1) {
        navStack.pop();
        renderCurrentView();
        window.scrollTo(0, 0);
      }
    }

    function jumpToCrumb(index) {
      if (index < navStack.length - 1) {
        navStack = navStack.slice(0, index + 1);
        renderCurrentView();
        window.scrollTo(0, 0);
      }
    }

    function navigateRoot(viewName) {
      const labels = { home: 'خانه', categories: 'دسته‌بندی موضوعی', search: 'جستجو' };
      navStack = [{ view: viewName, label: labels[viewName] || 'خانه' }];
      renderCurrentView();
      window.scrollTo(0, 0);
    }

    function renderTopBar() {
      const topBar = document.getElementById('topBar');
      const el = document.getElementById('breadcrumbs');
      if (navStack.length <= 1) {
        topBar.style.display = 'none';
        return;
      }
      topBar.style.display = 'flex';
      el.innerHTML = navStack.map((item, idx) => {
        const isLast = idx === navStack.length - 1;
        const sep = idx > 0 ? '<span class="crumb-sep">›</span>' : '';
        if (isLast) {
          return `${sep}<span class="crumb-item current">${escapeHtml(item.label)}</span>`;
        }
        return `${sep}<span class="crumb-item" onclick="jumpToCrumb(${idx})">${escapeHtml(item.label)}</span>`;
      }).join('');
      el.scrollLeft = -el.scrollWidth;
      applyTheme();
    }

    function updateBottomNav(currentView) {
      document.body.classList.toggle('reading-mode', currentView === 'reader');
      document.querySelectorAll('.nav-item').forEach(btn => {
        const target = btn.getAttribute('data-nav');
        const rootView = navStack[0] ? navStack[0].view : 'home';
        btn.classList.toggle('active', target === rootView);
      });
    }

    function renderCurrentView() {
      const state = navStack[navStack.length - 1];
      updateTelegramBackButton();
      renderTopBar();
      updateBottomNav(state.view);

      const app = document.getElementById('app');
      switch (state.view) {
        case 'home': renderHome(app); break;
        case 'teachers': renderTeachersList(app, state); break;
        case 'group': renderGroupView(app, state); break;
        case 'profile': renderProfileView(app, state); break;
        case 'sharai': renderSharaiView(app); break;
        case 'categories': renderCategoriesView(app); break;
        case 'category_detail': renderCategoryDetail(app, state); break;
        case 'search': renderSearchView(app, state); break;
        case 'reader': renderReaderView(app, state); break;
      }
    }

    // 1. Home View
    function renderHome(container) {
      let sliderHtml = '';
      if (DB.config.slider && DB.config.slider.enabled && Array.isArray(DB.config.slider.items) && DB.config.slider.items.length > 0) {
        const slides = DB.config.slider.items.map(item => `
          <a class="slider-item" href="javascript:void(0)" onclick="openExternal('${escapeHtml(item.link || '')}')">
            <img src="${escapeHtml(item.image)}" alt="اسلاید" loading="lazy" />
          </a>
        `).join('');
        sliderHtml = `<div class="slider-wrap"><div class="slider-track">${slides}</div></div>`;
      }

      const middleRow = DB.config.show_sharai ? `
        <div class="home-row-2">
          <button class="home-btn" onclick="pushView({ view: 'sharai', label: 'شرایع الاسلام' })">
            <span>شرایع الاسلام</span>
          </button>
          <button class="home-btn" onclick="pushView({ view: 'teachers', label: 'پژوهش‌های اساتید', filter: '' })">
            <span>پژوهش‌های اساتید</span>
          </button>
        </div>
      ` : `
        <button class="home-btn" onclick="pushView({ view: 'teachers', label: 'پژوهش‌های اساتید', filter: '' })">
          <span>پژوهش‌های اساتید</span>
        </button>
      `;

      container.innerHTML = `
        <div class="home-top-row">
          <div class="search-box">
            ${ICONS.search}
            <input type="text" placeholder="جستجو در کل آرشیو..." readonly onclick="navigateRoot('search')" />
          </div>
          <button class="theme-btn" id="homeThemeBtn" onclick="toggleTheme()" aria-label="تغییر حالت صفحه"></button>
        </div>
        ${sliderHtml}
        <div class="home-stack">
          <button class="home-btn primary" onclick="openProfileById('ahmed_alhasan')">
            <span>سید احمدالحسن (علیه السلام)</span>
          </button>
          ${middleRow}
          <button class="home-btn" onclick="openProfileById('friday_sermons')">
            <span>خطبه‌های نماز جمعه</span>
          </button>
        </div>
      `;
      applyTheme();
    }

    // 2. Teachers List View
    function renderTeachersList(container, state) {
      const q = normalizeText(state.filter || '');
      const groups = DB.teachers.filter(t => t.group === 'teachers' && t.type === 'group');
      const singles = DB.teachers.filter(t => t.group === 'teachers' && t.type !== 'group' && !t.parent_id);

      const filterFn = t => !q || normalizeText(t.name).includes(q) || (t.aliases && t.aliases.some(a => normalizeText(a).includes(q)));
      const filteredGroups = groups.filter(filterFn);
      const filteredSingles = singles.filter(filterFn);

      const groupCards = filteredGroups.map(g => `
        <div class="entity-card is-group" onclick="openGroupById('${g.id}')">
          ${DB.config.show_teacher_avatar && g.avatar ? `<img class="entity-avatar" src="${escapeHtml(g.avatar)}" />` : ''}
          <div class="entity-name">${escapeHtml(g.name)}</div>
          <div class="entity-meta">${getGroupStats(g)}</div>
        </div>
      `).join('');

      const singleCards = filteredSingles.map(t => {
        const meta = formatAssetCounts(getTeacherAssets(t));
        return `
          <div class="entity-card" onclick="openProfileById('${t.id}')">
            ${DB.config.show_teacher_avatar && t.avatar ? `<img class="entity-avatar" src="${escapeHtml(t.avatar)}" />` : ''}
            <div class="entity-name">${escapeHtml(t.name)}</div>
            <div class="entity-meta ${meta === 'به‌زودی' ? 'soon' : ''}">${meta}</div>
          </div>
        `;
      }).join('');

      container.innerHTML = `
        <div class="page-header">
          <div class="page-title">پژوهش‌های اساتید</div>
        </div>
        <div class="search-box">
          ${ICONS.search}
          <input type="text" id="teacherFilterInput" placeholder="جستجوی نام استاد یا گروه..." value="${escapeHtml(state.filter || '')}" oninput="updateLocalFilter(this.value)" />
        </div>
        <div class="entity-list">
          ${groupCards}
          ${singleCards}
          ${!groupCards && !singleCards ? '<div class="empty-state">موردی یافت نشد.</div>' : ''}
        </div>
      `;
      if (state.filter) {
        const inp = document.getElementById('teacherFilterInput');
        if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      }
    }

    function updateLocalFilter(val) {
      navStack[navStack.length - 1].filter = val;
      renderCurrentView();
    }

    // 3. Group View
    function openGroupById(id) {
      const group = DB.teachers.find(t => t.id === id);
      if (!group) return;
      pushView({ view: 'group', groupId: id, label: group.name, filter: '' });
    }

    function renderGroupView(container, state) {
      const group = DB.teachers.find(t => t.id === state.groupId);
      if (!group) return;
      const q = normalizeText(state.filter || '');
      const children = DB.teachers.filter(t => t.parent_id === group.id)
        .filter(t => !q || normalizeText(t.name).includes(q));

      const cards = children.map(t => {
        const meta = formatAssetCounts(getTeacherAssets(t));
        return `
          <div class="entity-card" onclick="openProfileById('${t.id}')">
            ${DB.config.show_teacher_avatar && t.avatar ? `<img class="entity-avatar" src="${escapeHtml(t.avatar)}" />` : ''}
            <div class="entity-name">${escapeHtml(t.name)}</div>
            <div class="entity-meta ${meta === 'به‌زودی' ? 'soon' : ''}">${meta}</div>
          </div>
        `;
      }).join('');

      container.innerHTML = `
        <div class="page-header">
          <div class="page-title">${escapeHtml(group.name)}</div>
          ${renderSocialLinks(group.links)}
        </div>
        <div class="search-box">
          ${ICONS.search}
          <input type="text" id="groupFilterInput" placeholder="جستجو در این بخش..." value="${escapeHtml(state.filter || '')}" oninput="updateLocalFilter(this.value)" />
        </div>
        <div class="entity-list">
          ${cards || '<div class="empty-state">به‌زودی</div>'}
        </div>
      `;
      if (state.filter) {
        const inp = document.getElementById('groupFilterInput');
        if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      }
    }

    function renderSocialLinks(links) {
      if (!links) return '';
      const btns = [];
      if (links.x) btns.push(`<a class="social-btn btn-x" href="javascript:void(0)" onclick="openExternal('${escapeHtml(links.x)}')">${ICONS.x}<span>X</span></a>`);
      if (links.youtube) btns.push(`<a class="social-btn btn-yt" href="javascript:void(0)" onclick="openExternal('${escapeHtml(links.youtube)}')">${ICONS.youtube}<span>YouTube</span></a>`);
      if (links.facebook) btns.push(`<a class="social-btn btn-fb" href="javascript:void(0)" onclick="openExternal('${escapeHtml(links.facebook)}')">${ICONS.facebook}<span>Facebook</span></a>`);
      return btns.length ? `<div class="social-row">${btns.join('')}</div>` : '';
    }

    // 4. Profile View
    function openProfileById(id) {
      const teacher = DB.teachers.find(t => t.id === id);
      if (!teacher) return;
      const cleanName = id === 'friday_sermons' ? 'خطبه‌های نماز جمعه' : teacher.name;
      pushView({ view: 'profile', teacherId: id, label: cleanName, activeTab: null, postSort: 'newest' });
    }

    function renderProfileView(container, state) {
      const teacher = DB.teachers.find(t => t.id === state.teacherId);
      if (!teacher) return;
      const displayName = teacher.id === 'friday_sermons' ? 'خطبه‌های نماز جمعه' : teacher.name;
      const assets = getTeacherAssets(teacher);

      const availableTabs = [];
      if (assets.videos.length > 0) availableTabs.push({ key: 'videos', label: `ویدیوها (${toPersianDigits(assets.videos.length)})` });
      if (assets.books.length > 0) availableTabs.push({ key: 'books', label: `کتاب‌ها (${toPersianDigits(assets.books.length)})` });
      if (assets.posts.length > 0) availableTabs.push({ key: 'posts', label: `پست‌ها (${toPersianDigits(assets.posts.length)})` });

      if (!state.activeTab || !availableTabs.some(t => t.key === state.activeTab)) {
        state.activeTab = availableTabs.length > 0 ? availableTabs[0].key : null;
      }

      let bodyHtml = '';
      if (availableTabs.length === 0) {
        bodyHtml = '<div class="empty-state">به‌زودی محتوای این بخش منتشر خواهد شد.</div>';
      } else {
        const tabsHtml = availableTabs.length > 1 ? `
          <div class="tabs-bar">
            ${availableTabs.map(t => `
              <button class="tab-btn ${state.activeTab === t.key ? 'active' : ''}" onclick="switchProfileTab('${t.key}')">${t.label}</button>
            `).join('')}
          </div>
        ` : '';

        let listHtml = '';
        if (state.activeTab === 'videos') {
          listHtml = `<div class="cards-stack">${assets.videos.map(v => renderVideoCard(v, false)).join('')}</div>`;
        } else if (state.activeTab === 'books') {
          listHtml = `<div class="cards-stack">${assets.books.map(b => renderBookCard(b, false)).join('')}</div>`;
        } else if (state.activeTab === 'posts') {
          const sorted = [...assets.posts].sort((a, b) => {
            const da = a.date || '';
            const db = b.date || '';
            return state.postSort === 'oldest' ? da.localeCompare(db) : db.localeCompare(da);
          });
          listHtml = `
            <div class="post-sort-bar">
              <select class="post-sort-select" onchange="changePostSort(this.value)">
                <option value="newest" ${state.postSort === 'newest' ? 'selected' : ''}>مرتب‌سازی: جدیدترین</option>
                <option value="oldest" ${state.postSort === 'oldest' ? 'selected' : ''}>مرتب‌سازی: قدیمی‌ترین</option>
              </select>
            </div>
            <div class="cards-stack">${sorted.map(p => renderPostCard(p)).join('')}</div>
          `;
        }
        bodyHtml = tabsHtml + listHtml;
      }

      container.innerHTML = `
        <div class="page-header">
          <div class="page-title">${escapeHtml(displayName)}</div>
          ${renderSocialLinks(teacher.links)}
        </div>
        ${bodyHtml}
      `;
    }

    function switchProfileTab(tabKey) {
      navStack[navStack.length - 1].activeTab = tabKey;
      renderCurrentView();
    }

    function changePostSort(val) {
      navStack[navStack.length - 1].postSort = val;
      renderCurrentView();
    }

    // 5. Shara'i View (Hidden by default via config)
    function renderSharaiView(container) {
      const key = normalizeText('شرایع');
      const books = DB.books.filter(b => normalizeText(b.title).includes(key) || normalizeText(b.macro_topic).includes(key));
      const videos = DB.videos.filter(v => normalizeText(v.title).includes(key) || normalizeText(v.macro_topic).includes(key));

      let content = '';
      if (books.length === 0 && videos.length === 0) {
        content = '<div class="empty-state">به‌زودی محتوای بخش شرایع الاسلام منتشر خواهد شد.</div>';
      } else {
        content = `
          <div class="cards-stack">
            ${books.map(b => renderBookCard(b, true)).join('')}
            ${videos.map(v => renderVideoCard(v, true)).join('')}
          </div>
        `;
      }

      container.innerHTML = `
        <div class="page-header">
          <div class="page-title">شرایع الاسلام</div>
        </div>
        ${content}
      `;
    }

    // Cards Renderers
    function renderVideoCard(v, showSpeaker) {
      const showCat = DB.config.show_category_on_card && v.macro_topic;
      const summary = v.session_topic || v.summary || '';
      const downloadUrl = v.pdf_url || v.telegram_link || '';

      const actions = [];
      if (v.text_file) {
        actions.push(`<button class="action-btn btn-read" onclick="openReader('video', '${v.id}')">${ICONS.book}<span>مطالعه آنلاین</span></button>`);
      }
      if (downloadUrl) {
        actions.push(`<button class="action-btn btn-pdf" onclick="openExternal('${escapeHtml(downloadUrl)}')">${ICONS.download}<span>دانلود PDF</span></button>`);
      }
      if (v.youtube_link) {
        actions.push(`<button class="action-btn btn-yt" onclick="openExternal('${escapeHtml(v.youtube_link)}')">${ICONS.youtube}<span>ویدیوی اصلی</span></button>`);
      }
      if (v.facebook_link) {
        actions.push(`<button class="action-btn btn-fb" onclick="openExternal('${escapeHtml(v.facebook_link)}')">${ICONS.facebook}<span>ویدیوی اصلی</span></button>`);
      }
      actions.push(`<button class="action-btn btn-share" onclick="shareItem('video', '${v.id}', '${escapeHtml(v.title)}')">${ICONS.share}<span>Share</span></button>`);

      return `
        <div class="content-card">
          <div class="card-title">${escapeHtml(v.title)}</div>
          ${showSpeaker && v.speaker ? `<div class="card-speaker">${escapeHtml(v.speaker)}</div>` : ''}
          ${showCat ? `<div class="card-cat">${escapeHtml(v.macro_topic)}</div>` : ''}
          ${summary ? `<div class="card-summary">${escapeHtml(summary)}</div>` : ''}
          <div class="card-actions">${actions.join('')}</div>
        </div>
      `;
    }

    function renderBookCard(b, showSpeaker) {
      const showCat = DB.config.show_category_on_card && b.macro_topic;
      const summary = b.summary || '';
      const downloadUrl = b.pdf_url || b.telegram_link || '';

      const actions = [];
      if (b.text_file) {
        actions.push(`<button class="action-btn btn-read" onclick="openReader('book', '${b.id}')">${ICONS.book}<span>مطالعه آنلاین</span></button>`);
      }
      if (downloadUrl) {
        actions.push(`<button class="action-btn btn-pdf" onclick="openExternal('${escapeHtml(downloadUrl)}')">${ICONS.download}<span>دانلود PDF</span></button>`);
      }
      actions.push(`<button class="action-btn btn-share" onclick="shareItem('book', '${b.id}', '${escapeHtml(b.title)}')">${ICONS.share}<span>Share</span></button>`);

      return `
        <div class="content-card">
          <div class="card-title">${escapeHtml(b.title)}</div>
          ${showSpeaker && b.speaker ? `<div class="card-speaker">${escapeHtml(b.speaker)}</div>` : ''}
          ${showCat ? `<div class="card-cat">${escapeHtml(b.macro_topic)}</div>` : ''}
          ${summary ? `<div class="card-summary">${escapeHtml(summary)}</div>` : ''}
          <div class="card-actions">${actions.join('')}</div>
        </div>
      `;
    }

    function renderPostCard(p) {
      const preview = p.content || p.title || 'برای مشاهده متن کامل کلیک کنید...';
      return `
        <div class="content-card">
          ${p.date ? `<div class="post-date">${toPersianDigits(p.date)}</div>` : ''}
          <div class="post-preview">${escapeHtml(preview)}</div>
          <div class="post-footer">
            <button class="action-btn btn-read" style="flex:0 1 auto; padding: 8px 16px;" onclick="openReader('post', '${p.id}')">${ICONS.book}<span>مطالعه آنلاین</span></button>
          </div>
        </div>
      `;
    }

    // 6. Reading Mode
    function openReader(type, id) {
      let item = null;
      if (type === 'video') item = DB.videos.find(x => String(x.id) === String(id));
      if (type === 'book') item = DB.books.find(x => String(x.id) === String(id));
      if (type === 'post') item = DB.posts.find(x => String(x.id) === String(id));
      if (!item) return;

      pushView({
        view: 'reader',
        itemType: type,
        itemId: id,
        label: 'مطالعه آنلاین'
      });
    }

    async function renderReaderView(container, state) {
      let item = null;
      if (state.itemType === 'video') item = DB.videos.find(x => String(x.id) === String(state.itemId));
      if (state.itemType === 'book') item = DB.books.find(x => String(x.id) === String(state.itemId));
      if (state.itemType === 'post') item = DB.posts.find(x => String(x.id) === String(state.itemId));

      if (!item) {
        container.innerHTML = '<div class="empty-state">مطلب مورد نظر یافت نشد.</div>';
        return;
      }

      const title = item.title || '';
      const dateStr = item.date ? `تاریخ: ${toPersianDigits(item.date)}` : '';

      const sourceBtns = [];
      if (item.source_x) sourceBtns.push(`<a class="social-btn btn-x" href="javascript:void(0)" onclick="openExternal('${escapeHtml(item.source_x)}')">${ICONS.x}<span>منبع: X</span></a>`);
      if (item.source_facebook) sourceBtns.push(`<a class="social-btn btn-fb" href="javascript:void(0)" onclick="openExternal('${escapeHtml(item.source_facebook)}')">${ICONS.facebook}<span>منبع: Facebook</span></a>`);
      if (item.youtube_link) sourceBtns.push(`<a class="social-btn btn-yt" href="javascript:void(0)" onclick="openExternal('${escapeHtml(item.youtube_link)}')">${ICONS.youtube}<span>ویدیوی اصلی</span></a>`);

      container.innerHTML = `
        <div class="reader-wrap">
          ${title ? `<div class="reader-title">${escapeHtml(title)}</div>` : ''}
          ${dateStr ? `<div class="reader-meta">${dateStr}</div>` : ''}
          <div id="readerBody" class="reader-body">در حال بارگذاری متن...</div>
          <div class="reader-footer">
            <div class="social-row" style="margin-top:0;">${sourceBtns.join('')}</div>
            <button class="action-btn btn-share" onclick="shareItem('${state.itemType}', '${state.itemId}', '${escapeHtml(title || 'مطالعه آنلاین')}')">${ICONS.share}<span>Share</span></button>
          </div>
        </div>
      `;

      const bodyEl = document.getElementById('readerBody');
      if (item.text_file) {
        try {
          const res = await fetch(item.text_file);
          if (!res.ok) throw new Error('not found');
          bodyEl.textContent = await res.text();
        } catch (e) {
          bodyEl.textContent = item.content || 'خطا در بارگذاری فایل متنی.';
        }
      } else {
        bodyEl.textContent = item.content || 'متنی برای نمایش ثبت نشده است.';
      }
    }

    // 7. Categories View
    function renderCategoriesView(container) {
      const catMap = {};
      DB.videos.forEach(v => {
        if (v.macro_topic) catMap[v.macro_topic] = (catMap[v.macro_topic] || 0) + 1;
      });
      DB.books.forEach(b => {
        if (b.macro_topic) catMap[b.macro_topic] = (catMap[b.macro_topic] || 0) + 1;
      });

      const cats = Object.keys(catMap).sort((a, b) => catMap[b] - catMap[a]);
      const cards = cats.map(c => `
        <div class="entity-card" onclick="pushView({ view: 'category_detail', category: '${escapeHtml(c)}', label: '${escapeHtml(c)}' })">
          <div class="entity-name">${escapeHtml(c)}</div>
          <div class="entity-meta">${toPersianDigits(catMap[c])} اثر</div>
        </div>
      `).join('');

      container.innerHTML = `
        <div class="page-header">
          <div class="page-title">دسته‌بندی موضوعی</div>
        </div>
        <div class="entity-list">
          ${cards || '<div class="empty-state">دسته‌بندی ثبت نشده است.</div>'}
        </div>
      `;
    }

    function renderCategoryDetail(container, state) {
      const cat = state.category;
      const videos = DB.videos.filter(v => v.macro_topic === cat);
      const books = DB.books.filter(b => b.macro_topic === cat);

      container.innerHTML = `
        <div class="page-header">
          <div class="page-title">${escapeHtml(cat)}</div>
        </div>
        <div class="cards-stack">
          ${videos.map(v => renderVideoCard(v, true)).join('')}
          ${books.map(b => renderBookCard(b, true)).join('')}
        </div>
      `;
    }

    // 8. Global Search View
    function renderSearchView(container, state) {
      const q = normalizeText(state.query || '');
      let resultsHtml = '';

      if (!q) {
        resultsHtml = '<div class="empty-state">عبارت مورد نظر خود را برای جستجو در کل آرشیو بنویسید.</div>';
      } else {
        const matchedTeachers = DB.teachers.filter(t =>
          t.type !== 'group' && (
            normalizeText(t.name).includes(q) ||
            (t.aliases && t.aliases.some(a => normalizeText(a).includes(q)))
          )
        );
        const matchedVideos = DB.videos.filter(v =>
          normalizeText(v.title).includes(q) ||
          normalizeText(v.speaker).includes(q) ||
          normalizeText(v.macro_topic).includes(q) ||
          normalizeText(v.session_topic).includes(q) ||
          (Array.isArray(v.tags) && v.tags.some(tag => normalizeText(tag.replace(/_/g, ' ')).includes(q)))
        );
        const matchedBooks = DB.books.filter(b =>
          normalizeText(b.title).includes(q) ||
          normalizeText(b.macro_topic).includes(q) ||
          normalizeText(b.summary).includes(q) ||
          (Array.isArray(b.tags) && b.tags.some(tag => normalizeText(tag.replace(/_/g, ' ')).includes(q)))
        );
        const matchedPosts = DB.posts.filter(p =>
          normalizeText(p.content).includes(q) || normalizeText(p.title).includes(q)
        );

        if (matchedTeachers.length) {
          resultsHtml += `<div class="section-label">اساتید (${toPersianDigits(matchedTeachers.length)})</div>`;
          resultsHtml += `<div class="entity-list">${matchedTeachers.map(t => `
            <div class="entity-card" onclick="openProfileById('${t.id}')">
              <div class="entity-name">${escapeHtml(t.name)}</div>
              <div class="entity-meta">${formatAssetCounts(getTeacherAssets(t))}</div>
            </div>
          `).join('')}</div>`;
        }
        if (matchedVideos.length) {
          resultsHtml += `<div class="section-label">ویدیوها (${toPersianDigits(matchedVideos.length)})</div>`;
          resultsHtml += `<div class="cards-stack">${matchedVideos.map(v => renderVideoCard(v, true)).join('')}</div>`;
        }
        if (matchedBooks.length) {
          resultsHtml += `<div class="section-label">کتاب‌ها (${toPersianDigits(matchedBooks.length)})</div>`;
          resultsHtml += `<div class="cards-stack">${matchedBooks.map(b => renderBookCard(b, true)).join('')}</div>`;
        }
        if (matchedPosts.length) {
          resultsHtml += `<div class="section-label">پست‌ها (${toPersianDigits(matchedPosts.length)})</div>`;
          resultsHtml += `<div class="cards-stack">${matchedPosts.map(p => renderPostCard(p)).join('')}</div>`;
        }
        if (!resultsHtml) {
          resultsHtml = '<div class="empty-state">نتیجه‌ای یافت نشد.</div>';
        }
      }

      container.innerHTML = `
        <div class="search-box">
          ${ICONS.search}
          <input type="text" id="globalSearchInput" placeholder="جستجو در عنوان، استاد، موضوع و کلیدواژه‌ها..." value="${escapeHtml(state.query || '')}" oninput="updateGlobalSearch(this.value)" />
        </div>
        ${resultsHtml}
      `;
      const inp = document.getElementById('globalSearchInput');
      if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
    }

    function updateGlobalSearch(val) {
      navStack[navStack.length - 1].query = val;
      renderCurrentView();
    }

    // Initialization & Deep Linking
    async function safeFetchJson(url, fallback) {
      try {
        const res = await fetch(`${url}?v=${Date.now()}`);
        if (!res.ok) return fallback;
        return await res.json();
      } catch (e) {
        return fallback;
      }
    }

    function handleDeepLink() {
      let startParam = tg && tg.initDataUnsafe ? tg.initDataUnsafe.start_param : null;
      if (!startParam) {
        const params = new URLSearchParams(window.location.search);
        startParam = params.get('startapp');
      }
      if (!startParam) return;

      const [type, ...rest] = startParam.split('_');
      const id = rest.join('_');
      if (!id) return;

      if (type === 'video') {
        const v = DB.videos.find(x => String(x.id) === id);
        if (v) {
          if (v.text_file) {
            openReader('video', id);
          } else {
            const teacher = DB.teachers.find(t => getTeacherMatchNames(t).includes(normalizeText(v.speaker)));
            if (teacher) openProfileById(teacher.id);
          }
        }
      } else if (type === 'book') {
        const b = DB.books.find(x => String(x.id) === id);
        if (b && b.text_file) openReader('book', id);
      } else if (type === 'post') {
        openReader('post', id);
      } else if (type === 'teacher') {
        openProfileById(id);
      }
    }

    async function init() {
      const [config, teachers, videos, books, posts] = await Promise.all([
        safeFetchJson('config.json', DB.config),
        safeFetchJson('teachers.json', []),
        safeFetchJson('data.json', []),
        safeFetchJson('books.json', []),
        safeFetchJson('posts.json', [])
      ]);

      DB.config = Object.assign(DB.config, config);
      DB.teachers = Array.isArray(teachers) ? teachers : [];
      DB.videos = Array.isArray(videos) ? videos : [];
      DB.books = Array.isArray(books) ? books : [];
      DB.posts = Array.isArray(posts) ? posts : [];

      navStack = [{ view: 'home', label: 'خانه' }];
      renderCurrentView();
      handleDeepLink();
    }

    init();
  </script>
</body>
</html>
