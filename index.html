<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>آرشیو سرای ترجمه</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    :root {
      --bg: #f4f6f9;
      --secondary-bg: #ffffff;
      --text: #1e293b;
      --hint: #64748b;
      --accent: #1d4ed8;
      --accent-soft: rgba(29, 78, 216, 0.1);
      --accent-text: #ffffff;
      --border: rgba(148, 163, 184, 0.25);
      --card-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
      --group-bg: rgba(29, 78, 216, 0.06);
      --group-border: rgba(29, 78, 216, 0.22);
      --summary-bg: rgba(148, 163, 184, 0.09);
      --btn-x-bg: #0f172a;
      --btn-x-text: #ffffff;
      --radius: 14px;
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --secondary-bg: #1e293b;
      --text: #f1f5f9;
      --hint: #94a3b8;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.16);
      --accent-text: #ffffff;
      --border: rgba(148, 163, 184, 0.16);
      --card-shadow: 0 2px 10px rgba(0, 0, 0, 0.25);
      --group-bg: rgba(59, 130, 246, 0.12);
      --group-border: rgba(59, 130, 246, 0.3);
      --summary-bg: rgba(255, 255, 255, 0.05);
      --btn-x-bg: #f1f5f9;
      --btn-x-text: #0f172a;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.7;
      padding-bottom: 78px;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.2s, color 0.2s;
    }

    body.reading-mode {
      padding-bottom: 28px;
      background-color: var(--secondary-bg);
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 14px 16px;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 14px;
      background: var(--secondary-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 45;
    }
    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      white-space: nowrap;
      font-size: 0.8rem;
      color: var(--hint);
      scrollbar-width: none;
      flex: 1;
    }
    .breadcrumbs::-webkit-scrollbar { display: none; }
    .crumb-item {
      cursor: pointer;
      color: var(--accent);
      font-weight: 500;
    }
    .crumb-item.current {
      color: var(--text);
      cursor: default;
      font-weight: 600;
    }
    .crumb-sep {
      color: var(--hint);
      opacity: 0.6;
      user-select: none;
    }

    .theme-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }
    .theme-btn:active { opacity: 0.7; }
    .theme-btn svg { width: 18px; height: 18px; }

    /* Home Top Search + Theme Row */
    .home-top-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .home-top-row .search-box {
      flex: 1;
      margin-bottom: 0;
    }
    .home-top-row .theme-btn {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: var(--secondary-bg);
    }

    /* Smart Search Input */
    .search-wrap {
      margin-bottom: 16px;
    }
    .search-box {
      position: relative;
      margin-bottom: 16px;
    }
    .search-wrap .search-box {
      margin-bottom: 0;
    }
    .search-box input {
      width: 100%;
      padding: 12px 42px 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--secondary-bg);
      color: var(--text);
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus {
      border-color: var(--accent);
    }
    .search-box svg {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--hint);
      pointer-events: none;
    }
    .search-scope-bar {
      display: none;
      gap: 8px;
      margin-top: 8px;
    }
    .search-scope-bar.visible {
      display: flex;
    }
    .scope-pill {
      flex: 1;
      padding: 7px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--secondary-bg);
      color: var(--hint);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    .scope-pill.active {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    /* Slider */
    .slider-wrap {
      margin-bottom: 18px;
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
      background: var(--secondary-bg);
      border: 1px solid var(--border);
    }
    .slider-track {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .slider-track::-webkit-scrollbar { display: none; }
    .slider-item {
      min-width: 100%;
      scroll-snap-align: start;
      display: block;
    }
    .slider-item img {
      width: 100%;
      height: 165px;
      object-fit: cover;
      display: block;
    }

    /* Home Grid Buttons */
    .home-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .home-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .home-btn {
      background: var(--secondary-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 14px;
      text-align: center;
      font-family: inherit;
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      box-shadow: var(--card-shadow);
      transition: transform 0.15s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 76px;
    }
    .home-btn:active {
      transform: scale(0.98);
      border-color: var(--accent);
    }
    .home-btn.primary {
      background: linear-gradient(135deg, #1d4ed8, #1e3a8a);
      color: #ffffff;
      border: none;
      min-height: 88px;
      font-size: 1.05rem;
    }

    /* Page Header */
    .page-header {
      text-align: center;
      padding: 8px 0 16px;
    }
    .page-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
    }

    /* Telegram-Inspired Profile Card (Item 8) */
    .profile-card {
      background: var(--secondary-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 14px 14px;
      text-align: center;
      box-shadow: var(--card-shadow);
      margin-bottom: 14px;
    }
    .profile-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 10px;
      display: block;
      border: 2px solid var(--border);
    }
    .profile-avatar-fallback {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      margin: 0 auto 10px;
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.45rem;
      font-weight: 700;
      border: 1px solid var(--group-border);
    }
    .profile-name {
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.5;
    }
    .profile-bio {
      font-size: 0.82rem;
      color: var(--hint);
      margin-top: 6px;
      line-height: 1.65;
      padding: 0 6px;
    }
    .profile-actions-grid {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    .profile-action-tile {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 10px 6px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.12s, opacity 0.15s;
    }
    .profile-action-tile:active {
      transform: scale(0.96);
      opacity: 0.85;
    }
    .profile-action-tile svg {
      width: 18px;
      height: 18px;
    }
    .profile-action-tile.tile-fb svg { color: #1877f2; }
    .profile-action-tile.tile-yt svg { color: #c81e1e; }
    .profile-action-tile.tile-x svg { color: var(--text); }
    .profile-action-tile.tile-share svg { color: var(--accent); }

    /* Social Pill Buttons (for Reader Footer) */
    .social-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .social-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 10px;
      border: none;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .social-btn:active { opacity: 0.8; }
    .social-btn svg { width: 15px; height: 15px; }
    .social-btn.btn-x { background: var(--btn-x-bg); color: var(--btn-x-text); }
    .social-btn.btn-yt { background: #c81e1e; color: #ffffff; }
    .social-btn.btn-fb { background: #1877f2; color: #ffffff; }

    /* Center-Aligned Teacher & Group Cards */
    .entity-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .entity-card {
      background: var(--secondary-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 14px;
      text-align: center;
      cursor: pointer;
      box-shadow: var(--card-shadow);
      transition: transform 0.15s, border-color 0.2s;
    }
    .entity-card:active {
      transform: scale(0.99);
      border-color: var(--accent);
    }
    .entity-card.is-group {
      background: var(--group-bg);
      border: 1px solid var(--group-border);
    }
    .entity-avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 8px;
      display: block;
      border: 1px solid var(--border);
    }
    .entity-name {
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text);
    }
    .entity-meta {
      font-size: 0.78rem;
      color: var(--hint);
      margin-top: 4px;
    }
    .entity-meta.soon { opacity: 0.75; }

    /* Tabs */
    .tabs-bar {
      display: flex;
      background: var(--secondary-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 14px;
      gap: 4px;
    }
    .tab-btn {
      flex: 1;
      padding: 9px 6px;
      border: none;
      background: transparent;
      color: var(--hint);
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      border-radius: 9px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .tab-btn.active {
      background: var(--accent);
      color: var(--accent-text);
    }

    /* Content Cards */
    .cards-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .content-card {
      background: var(--secondary-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--card-shadow);
    }
    .card-header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .card-title {
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.65;
      flex: 1;
    }
    .bookmark-icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--hint);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .bookmark-icon-btn.saved {
      color: var(--accent);
      background: var(--accent-soft);
      border-color: var(--group-border);
    }
    .bookmark-icon-btn svg {
      width: 17px;
      height: 17px;
    }

    .card-speaker {
      font-size: 0.8rem;
      color: var(--accent);
      margin-top: 4px;
      font-weight: 500;
    }
    .card-cat {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 10px;
      border-radius: 8px;
      background: rgba(148, 163, 184, 0.14);
      color: var(--hint);
      font-size: 0.76rem;
      font-weight: 500;
    }
    .card-summary {
      margin-top: 12px;
      padding: 10px 12px;
      border-right: 3px solid var(--accent);
      background: var(--summary-bg);
      border-radius: 6px;
      font-size: 0.84rem;
      color: var(--text);
      line-height: 1.75;
    }
    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }
    .action-btn {
      flex: 1 1 calc(50% - 8px);
      min-width: 120px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid transparent;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .action-btn:active { opacity: 0.82; transform: scale(0.98); }
    .action-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

    .action-btn.btn-read { background: #1d4ed8; color: #ffffff; }
    .action-btn.btn-pdf { background: #059669; color: #ffffff; }
    .action-btn.btn-yt { background: #c81e1e; color: #ffffff; }
    .action-btn.btn-fb { background: #1877f2; color: #ffffff; }
    .action-btn.btn-share {
      flex: 0 1 auto;
      min-width: 84px;
      background: var(--bg);
      color: var(--text);
      border-color: var(--border);
    }
    .action-btn.btn-copy {
      flex: 0 1 auto;
      min-width: 96px;
      background: var(--bg);
      color: var(--text);
      border-color: var(--border);
    }

    /* Post Card Specific */
    .post-sort-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }
    .post-sort-select {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--secondary-bg);
      color: var(--text);
      font-family: inherit;
      font-size: 0.8rem;
      outline: none;
    }
    .post-date {
      font-size: 0.78rem;
      color: var(--hint);
    }
    .post-preview {
      font-size: 0.9rem;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.75;
      margin-top: 6px;
    }
    .post-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      gap: 8px;
    }

    /* Reading Mode */
    .reader-wrap {
      padding: 6px 4px 20px;
    }
    .reader-header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }
    .reader-title {
      font-size: 1.12rem;
      font-weight: 700;
      line-height: 1.7;
      flex: 1;
    }
    .reader-meta {
      font-size: 0.8rem;
      color: var(--hint);
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .reader-body {
      font-size: 0.98rem;
      line-height: 2.05;
      white-space: pre-wrap;
      color: var(--text);
      text-align: justify;
    }

    /* Sticky Audio Player & Synced Text (Item 9) */
    .audio-sticky-bar {
      position: sticky;
      top: 55px;
      z-index: 35;
      background: var(--secondary-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
    }
    .audio-controls-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .audio-play-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .audio-play-btn svg { width: 18px; height: 18px; }
    .audio-progress-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .audio-seek {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
      direction: ltr;
    }
    .audio-times {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--hint);
      direction: ltr;
    }
    .audio-mini-btn {
      padding: 5px 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    .audio-mini-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--group-border);
    }

    .sync-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .sync-segment {
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
    }
    .sync-segment:hover {
      background: var(--summary-bg);
    }
    .sync-segment.active {
      background: var(--accent-soft);
      border-color: var(--group-border);
    }
    .sync-time-badge {
      display: inline-block;
      font-size: 0.72rem;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 1px 7px;
      border-radius: 6px;
      margin-bottom: 6px;
      font-weight: 600;
      direction: ltr;
    }
    .sync-ar {
      font-size: 0.94rem;
      line-height: 1.9;
      color: var(--hint);
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px dashed var(--border);
      display: none;
    }
    .sync-list.show-ar .sync-ar {
      display: block;
    }
    .sync-fa {
      font-size: 0.98rem;
      line-height: 2;
      color: var(--text);
      text-align: justify;
    }

    .reader-footer {
      margin-top: 26px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .reader-footer-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Prev / Next Bar in Reader (Item 4) */
    .reader-nav-row {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px dashed var(--border);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .reader-nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .reader-nav-btn:active { opacity: 0.75; }
    .reader-nav-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .reader-nav-btn svg { width: 16px; height: 16px; }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--hint);
      font-size: 0.92rem;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 76px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #0f172a;
      color: #ffffff;
      padding: 9px 18px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 100;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Bottom Navigation (Fixed 3 Tabs - Item 7) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 62px;
      background: var(--secondary-bg);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 50;
      padding-bottom: env(safe-area-inset-bottom);
    }
    body.reading-mode .bottom-nav {
      display: none;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border: none;
      background: transparent;
      color: var(--hint);
      font-family: inherit;
      font-size: 0.74rem;
      font-weight: 500;
      cursor: pointer;
      height: 100%;
    }
    .nav-item.active {
      color: var(--accent);
      font-weight: 700;
    }
    .nav-item svg {
      width: 20px;
      height: 20px;
    }

    .section-label {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--hint);
      margin: 18px 0 10px;
    }
  </style>
</head>
<body>

  <div id="topBar" class="top-bar" style="display:none;">
    <div id="breadcrumbs" class="breadcrumbs"></div>
    <button class="theme-btn" onclick="toggleTheme()" aria-label="تغییر حالت صفحه" id="topThemeBtn"></button>
  </div>

  <main id="app" class="container">
    <div class="empty-state">در حال بارگذاری آرشیو...</div>
  </main>

  <div id="toast" class="toast"></div>

  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-item active" data-nav="home" onclick="navigateRoot('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>خانه</span>
    </button>
    <button class="nav-item" data-nav="categories" onclick="navigateRoot('categories')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span>دسته‌بندی</span>
    </button>
    <button class="nav-item" data-nav="bookmarks" onclick="navigateRoot('bookmarks')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      <span>نشان‌شده‌ها</span>
    </button>
  </nav>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Theme Management
    const ICONS_THEME = {
      moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
      sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>'
    };

    function getInitialTheme() {
      const saved = localStorage.getItem('archive_theme');
      if (saved === 'dark' || saved === 'light') return saved;
      if (tg && tg.colorScheme === 'dark') return 'dark';
      return 'light';
    }

    let currentTheme = getInitialTheme();

    function applyTheme() {
      document.documentElement.setAttribute('data-theme', currentTheme);
      localStorage.setItem('archive_theme', currentTheme);
      const icon = currentTheme === 'dark' ? ICONS_THEME.sun : ICONS_THEME.moon;
      const topBtn = document.getElementById('topThemeBtn');
      if (topBtn) topBtn.innerHTML = icon;
      const homeBtn = document.getElementById('homeThemeBtn');
      if (homeBtn) homeBtn.innerHTML = icon;
    }

    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      applyTheme();
    }

    applyTheme();

    // Global State
    const DB = {
      config: {
        bot_username: 'STarjomehPostBot',
        app_short_name: 'archive',
        show_category_on_card: true,
        show_teacher_avatar: false,
        show_sharai: false,
        post_files: [],
        slider: { enabled: false, items: [] }
      },
      teachers: [],
      videos: [],
      books: [],
      posts: []
    };

    let navStack = [];
    let activeAudio = null;
    let currentReaderTextForCopy = '';
    let currentReaderTitleForCopy = '';
    let toastTimer = null;

    const ICONS = {
      search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
      book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
      download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
      video: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
      play: '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"/></svg>',
      pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>',
      share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>',
      copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
      bookmark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>',
      bookmarkFill: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>',
      chevronRight: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',
      chevronLeft: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>',
      x: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>',
      facebook: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 13.5h2.5l1-4H14v-2c0-1.03 0-2 2-2h1.5V2.14c-.326-.043-1.557-.14-2.857-.14C11.928 2 10 3.657 10 6.7v2.8H7v4h3V22h4v-8.5z"/></svg>',
      youtube: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>'
    };

    // Helpers
    function showToast(msg) {
      const el = document.getElementById('toast');
      if (!el) return;
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
    }

    function normalizeText(str) {
      if (!str) return '';
      return String(str)
        .replace(/ي/g, 'ی')
        .replace(/ك/g, 'ک')
        .replace(/ة/g, 'ه')
        .replace(/ۀ/g, 'ه')
        .replace(/\u200c/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .toLowerCase();
    }

    function toPersianDigits(num) {
      return String(num).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escapeJs(str) {
      if (!str) return '';
      return String(str)
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/"/g, '&quot;')
        .replace(/\n/g, ' ');
    }

    function getAppBaseLink() {
      const bot = DB.config.bot_username || 'STarjomehPostBot';
      const app = DB.config.app_short_name || 'archive';
      return `https://t.me/${bot}/${app}`;
    }

    function buildDeepLink(type, id) {
      if (!type || !id) return getAppBaseLink();
      return `${getAppBaseLink()}?startapp=${type}_${id}`;
    }

    function openExternal(url) {
      if (!url) return;
      if (tg) {
        if (url.startsWith('https://t.me/') || url.startsWith('http://t.me/')) {
          tg.openTelegramLink(url);
        } else {
          tg.openLink(url);
        }
      } else {
        window.open(url, '_blank');
      }
    }

    function shareItem(type, id, title) {
      const deepLink = buildDeepLink(type, id);
      const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(deepLink)}&text=${encodeURIComponent(title || '')}`;
      openExternal(shareUrl);
    }

    // Auto-Attribution on Copy (Item 6)
    function getCurrentContextLink() {
      const state = navStack[navStack.length - 1];
      if (!state) return getAppBaseLink();
      if (state.view === 'reader' || state.view === 'item_detail') {
        return buildDeepLink(state.itemType, state.itemId);
      }
      if (state.view === 'profile') {
        return buildDeepLink('teacher', state.teacherId);
      }
      return getAppBaseLink();
    }

    function buildAttributionFooter(link) {
      return `\n\n📌 منبع: آرشیو سرای ترجمه\n🔗 ${link || getCurrentContextLink()}`;
    }

    document.addEventListener('copy', (e) => {
      const activeTag = document.activeElement ? document.activeElement.tagName : '';
      if (activeTag === 'INPUT' || activeTag === 'TEXTAREA') return;
      const sel = window.getSelection();
      if (!sel || !sel.toString().trim()) return;
      const textWithSource = sel.toString().trim() + buildAttributionFooter();
      if (e.clipboardData) {
        e.clipboardData.setData('text/plain', textWithSource);
        e.preventDefault();
        showToast('متن همراه با منبع کپی شد');
      }
    });

    async function copyReaderFullText(type, id) {
      const link = buildDeepLink(type, id);
      const parts = [];
      if (currentReaderTitleForCopy) parts.push(currentReaderTitleForCopy);
      if (currentReaderTextForCopy) parts.push(currentReaderTextForCopy);
      const fullText = parts.join('\n\n') + buildAttributionFooter(link);
      try {
        await navigator.clipboard.writeText(fullText);
        showToast('متن کامل همراه با منبع کپی شد');
      } catch (err) {
        const ta = document.createElement('textarea');
        ta.value = fullText;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('متن کامل همراه با منبع کپی شد');
      }
    }

    // Bookmarks Storage (Item 7)
    function getBookmarks() {
      try {
        const raw = localStorage.getItem('archive_bookmarks');
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        return [];
      }
    }

    function isBookmarked(type, id) {
      return getBookmarks().some(b => b.type === type && String(b.id) === String(id));
    }

    function toggleBookmark(type, id, btnEl) {
      let list = getBookmarks();
      const idx = list.findIndex(b => b.type === type && String(b.id) === String(id));
      let saved = false;
      if (idx >= 0) {
        list.splice(idx, 1);
        showToast('از نشان‌شده‌ها حذف شد');
      } else {
        list.unshift({ type, id: String(id), savedAt: Date.now() });
        saved = true;
        showToast('در نشان‌شده‌ها ذخیره شد');
      }
      localStorage.setItem('archive_bookmarks', JSON.stringify(list));

      if (btnEl) {
        btnEl.classList.toggle('saved', saved);
        btnEl.innerHTML = saved ? ICONS.bookmarkFill : ICONS.bookmark;
      }

      const current = navStack[navStack.length - 1];
      if (current && current.view === 'bookmarks') {
        renderCurrentView();
      }
    }

    // Audio Cleanup
    function stopActiveAudio() {
      if (activeAudio) {
        activeAudio.pause();
        activeAudio.src = '';
        activeAudio = null;
      }
    }

    // Data Matching (including Friday Sermons fix - Item 2)
    function getTeacherMatchNames(teacher) {
      const names = [normalizeText(teacher.name)];
      if (Array.isArray(teacher.aliases)) {
        teacher.aliases.forEach(a => names.push(normalizeText(a)));
      }
      return names;
    }

    function isFridaySermonItem(item) {
      if (!item) return false;
      if (item.teacher_id === 'friday_sermons') return true;
      if (Array.isArray(item.tags) && item.tags.some(t => normalizeText(t.replace(/_/g, ' ')) === 'خطبه جمعه')) {
        return true;
      }
      const titleNorm = normalizeText(item.title);
      if (titleNorm.includes('خطبه') && titleNorm.includes('جمعه')) return true;
      const macroNorm = normalizeText(item.macro_topic);
      if (macroNorm.includes('خطبه') && macroNorm.includes('جمعه')) return true;
      return false;
    }

    function getTeacherAssets(teacher) {
      const matchNames = getTeacherMatchNames(teacher);
      const isFriday = teacher.id === 'friday_sermons';

      const videos = DB.videos.filter(v => {
        if (isFriday && isFridaySermonItem(v)) return true;
        if (v.teacher_id && v.teacher_id === teacher.id) return true;
        return matchNames.includes(normalizeText(v.speaker));
      });
      const books = DB.books.filter(b => {
        if (b.teacher_id && b.teacher_id === teacher.id) return true;
        return b.speaker && matchNames.includes(normalizeText(b.speaker));
      });
      const posts = DB.posts.filter(p => {
        if (isFriday && isFridaySermonItem(p)) return true;
        if (p.teacher_id && p.teacher_id === teacher.id) return true;
        return p.speaker && matchNames.includes(normalizeText(p.speaker));
      });
      return { videos, books, posts };
    }

    function formatAssetCounts(assets) {
      const parts = [];
      if (assets.videos.length > 0) parts.push(`${toPersianDigits(assets.videos.length)} ویدیو`);
      if (assets.books.length > 0) parts.push(`${toPersianDigits(assets.books.length)} کتاب`);
      if (assets.posts.length > 0) parts.push(`${toPersianDigits(assets.posts.length)} پست`);
      return parts.length > 0 ? parts.join(' • ') : 'به‌زودی';
    }

    function getGroupStats(groupTeacher) {
      const children = DB.teachers.filter(t => t.parent_id === groupTeacher.id);
      let totalAssets = 0;
      children.forEach(c => {
        const a = getTeacherAssets(c);
        totalAssets += a.videos.length + a.books.length + a.posts.length;
      });
      const parts = [];
      if (children.length > 0) parts.push(`${toPersianDigits(children.length)} استاد`);
      if (totalAssets > 0) parts.push(`${toPersianDigits(totalAssets)} اثر`);
      return parts.length > 0 ? parts.join(' • ') : 'به‌زودی';
    }

    function findItemByTypeAndId(type, id) {
      const sid = String(id);
      if (type === 'video') return DB.videos.find(x => String(x.id) === sid);
      if (type === 'book') return DB.books.find(x => String(x.id) === sid);
      if (type === 'post') return DB.posts.find(x => String(x.id) === sid);
      return null;
    }

    function hasReadableContent(item, type) {
      if (!item) return false;
      if (type === 'post') return true;
      return Boolean(item.text_file || item.sync_file || item.content);
    }

    // Navigation Engine with Scroll Restoration (Item 3)
    function updateTelegramBackButton() {
      if (!tg) return;
      if (navStack.length > 1) {
        tg.BackButton.show();
      } else {
        tg.BackButton.hide();
      }
    }

    if (tg) {
      tg.BackButton.onClick(() => goBack());
    }

    function saveCurrentScroll() {
      if (navStack.length > 0) {
        navStack[navStack.length - 1].scrollY = window.scrollY || document.documentElement.scrollTop || 0;
      }
    }

    function restoreScroll(y) {
      const targetY = typeof y === 'number' ? y : 0;
      requestAnimationFrame(() => {
        window.scrollTo(0, targetY);
        setTimeout(() => window.scrollTo(0, targetY), 30);
      });
    }

    function pushView(viewState) {
      stopActiveAudio();
      saveCurrentScroll();
      navStack.push(Object.assign({ scrollY: 0 }, viewState));
      renderCurrentView();
      window.scrollTo(0, 0);
    }

    function goBack() {
      if (navStack.length > 1) {
        stopActiveAudio();
        navStack.pop();
        const prev = navStack[navStack.length - 1];
        renderCurrentView();
        restoreScroll(prev.scrollY);
      }
    }

    function jumpToCrumb(index) {
      if (index < navStack.length - 1) {
        stopActiveAudio();
        navStack = navStack.slice(0, index + 1);
        const target = navStack[navStack.length - 1];
        renderCurrentView();
        restoreScroll(target.scrollY);
      }
    }

    function navigateRoot(viewName) {
      stopActiveAudio();
      const labels = {
        home: 'خانه',
        categories: 'دسته‌بندی موضوعی',
        bookmarks: 'نشان‌شده‌ها',
        search: 'جستجو'
      };
      navStack = [{ view: viewName, label: labels[viewName] || 'خانه', scrollY: 0 }];
      renderCurrentView();
      window.scrollTo(0, 0);
    }

    function renderTopBar() {
      const topBar = document.getElementById('topBar');
      const el = document.getElementById('breadcrumbs');
      if (navStack.length <= 1) {
        topBar.style.display = 'none';
        return;
      }
      topBar.style.display = 'flex';
      el.innerHTML = navStack.map((item, idx) => {
        const isLast = idx === navStack.length - 1;
        const sep = idx > 0 ? '<span class="crumb-sep">›</span>' : '';
        if (isLast) {
          return `${sep}<span class="crumb-item current">${escapeHtml(item.label)}</span>`;
        }
        return `${sep}<span class="crumb-item" onclick="jumpToCrumb(${idx})">${escapeHtml(item.label)}</span>`;
      }).join('');
      el.scrollLeft = -el.scrollWidth;
      applyTheme();
    }

    function updateBottomNav(currentView) {
      document.body.classList.toggle('reading-mode', currentView === 'reader');
      document.querySelectorAll('.nav-item').forEach(btn => {
        const target = btn.getAttribute('data-nav');
        const rootView = navStack[0] ? navStack[0].view : 'home';
        btn.classList.toggle('active', target === rootView);
      });
    }

    function renderCurrentView() {
      const state = navStack[navStack.length - 1];
      updateTelegramBackButton();
      renderTopBar();
      updateBottomNav(state.view);

      const app = document.getElementById('app');
      switch (state.view) {
        case 'home': renderHome(app); break;
        case 'teachers': renderTeachersList(app, state); break;
        case 'group': renderGroupView(app, state); break;
        case 'profile': renderProfileView(app, state); break;
        case 'sharai': renderSharaiView(app); break;
        case 'categories': renderCategoriesView(app); break;
        case 'category_detail': renderCategoryDetail(app, state); break;
        case 'bookmarks': renderBookmarksView(app); break;
        case 'search': renderSearchView(app, state); break;
        case 'item_detail': renderItemDetailView(app, state); break;
        case 'reader': renderReaderView(app, state); break;
      }
    }

    // Smart Search Helper (Item 7)
    function renderSmartSearchBox(placeholder, currentVal, onInputFnName) {
      const hasVal = Boolean(currentVal && currentVal.trim());
      return `
        <div class="search-wrap">
          <div class="search-box">
            ${ICONS.search}
            <input type="text" id="smartSearchInput" placeholder="${escapeHtml(placeholder)}"
              value="${escapeHtml(currentVal || '')}"
              onfocus="showSmartScopeBar()"
              oninput="${onInputFnName}(this.value)" />
          </div>
          <div id="smartScopeBar" class="search-scope-bar ${hasVal ? 'visible' : ''}">
            <button type="button" class="scope-pill active" onclick="showSmartScopeBar()">در این بخش</button>
            <button type="button" class="scope-pill" onclick="switchSmartSearchToGlobal()">کل آرشیو</button>
          </div>
        </div>
      `;
    }

    function showSmartScopeBar() {
      const bar = document.getElementById('smartScopeBar');
      if (bar) bar.classList.add('visible');
    }

    function switchSmartSearchToGlobal() {
      const inp = document.getElementById('smartSearchInput');
      const q = inp ? inp.value : '';
      pushView({ view: 'search', label: 'جستجو در کل آرشیو', query: q });

    // 1. Home View

            <span>شرایع الاسلام</span>
          </button>
          <button class="home-btn" onclick="pushView({ view: 'teachers', label: 'پژوهش‌های اساتید', filter: '' })">
            <span>پژوهش‌های اساتید</span>
          </button>

      ` : `
        <button class="home-btn" onclick="pushView({ view: 'teachers', label: 'پژوهش‌های اساتید', filter: '' })">

          <button class="home-btn primary" onclick="openProfileById('ahmed_alhasan')">
            <span>سید احمدالحسن (علیه السلام)</span>
          </button>

          <button class="home-btn" onclick="openProfileById('friday_sermons')">
            <span>خطبه‌های نماز جمعه</span>
          </button>
