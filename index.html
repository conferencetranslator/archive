    // 2. Teachers List View
    function buildTeachersListHtml(filterVal) {
      const q = normalizeText(filterVal || '');
      const groups = DB.teachers.filter(t => t.group === 'teachers' && t.type === 'group');
      const singles = DB.teachers.filter(t => t.group === 'teachers' && t.type !== 'group' && !t.parent_id);

      const filterFn = t => !q || normalizeText(t.name).includes(q) || (t.aliases && t.aliases.some(a => normalizeText(a).includes(q)));
      const filteredGroups = groups.filter(filterFn);
      const filteredSingles = singles.filter(filterFn);

      const groupCards = filteredGroups.map(g => `
        <div class="entity-card is-group" onclick="openGroupById('${escapeJs(g.id)}')">
          ${DB.config.show_teacher_avatar && g.avatar ? `<img class="entity-avatar" src="${escapeHtml(g.avatar)}" />` : ''}
          <div class="entity-name">${escapeHtml(g.name)}</div>
          <div class="entity-meta">${getGroupStats(g)}</div>
        </div>
      `).join('');

      const singleCards = filteredSingles.map(t => {
        const meta = formatAssetCounts(getTeacherAssets(t));
        return `
          <div class="entity-card" onclick="openProfileById('${escapeJs(t.id)}')">
            ${DB.config.show_teacher_avatar && t.avatar ? `<img class="entity-avatar" src="${escapeHtml(t.avatar)}" />` : ''}
            <div class="entity-name">${escapeHtml(t.name)}</div>
            <div class="entity-meta ${meta === 'به‌زودی' ? 'soon' : ''}">${meta}</div>
          </div>
        `;
      }).join('');

      return (groupCards + singleCards) || '<div class="empty-state">موردی در این بخش یافت نشد. می‌توانید دکمه «کل آرشیو» را بزنید.</div>';
    }

    function renderTeachersList(container, state) {
      container.innerHTML = `
        <div class="page-header">
          <div class="page-title">پژوهش‌های اساتید</div>
        </div>
        ${renderSmartSearchBox('جستجوی نام استاد یا گروه...', state.filter || '', 'onTeachersFilterInput')}
        <div class="entity-list" id="teachersListResults">
          ${buildTeachersListHtml(state.filter || '')}
        </div>
      `;
    }

    function onTeachersFilterInput(val) {
      navStack[navStack.length - 1].filter = val;
      showSmartScopeBar();
      const box = document.getElementById('teachersListResults');
      if (box) box.innerHTML = buildTeachersListHtml(val);
    }

    // 3. Group View
    function openGroupById(id) {
      const group = DB.teachers.find(t => t.id === id);
      if (!group) return;
      pushView({ view: 'group', groupId: id, label: group.name, filter: '' });
    }

    function buildGroupChildrenHtml(groupId, filterVal) {
      const q = normalizeText(filterVal || '');
      const children = DB.teachers.filter(t => t.parent_id === groupId)
        .filter(t => !q || normalizeText(t.name).includes(q) || (t.aliases && t.aliases.some(a => normalizeText(a).includes(q))));

      const cards = children.map(t => {
        const meta = formatAssetCounts(getTeacherAssets(t));
        return `
          <div class="entity-card" onclick="openProfileById('${escapeJs(t.id)}')">
            ${DB.config.show_teacher_avatar && t.avatar ? `<img class="entity-avatar" src="${escapeHtml(t.avatar)}" />` : ''}
            <div class="entity-name">${escapeHtml(t.name)}</div>
            <div class="entity-meta ${meta === 'به‌زودی' ? 'soon' : ''}">${meta}</div>
          </div>
        `;
      }).join('');

      return cards || '<div class="empty-state">موردی یافت نشد.</div>';
    }

    function renderGroupView(container, state) {
      const group = DB.teachers.find(t => t.id === state.groupId);
      if (!group) return;

      container.innerHTML = `
        ${renderTelegramProfileCard(group, group.name, 'group')}
        ${renderSmartSearchBox('جستجو در این گروه...', state.filter || '', 'onGroupFilterInput')}
        <div class="entity-list" id="groupChildrenResults">
          ${buildGroupChildrenHtml(group.id, state.filter || '')}
        </div>
      `;
    }

    function onGroupFilterInput(val) {
      const state = navStack[navStack.length - 1];
      state.filter = val;
      showSmartScopeBar();
      const box = document.getElementById('groupChildrenResults');
      if (box) box.innerHTML = buildGroupChildrenHtml(state.groupId, val);
    }

    // Telegram-Style Profile Header Renderer (Item 8)
    function renderTelegramProfileCard(entity, displayName, shareType) {
      let avatarHtml = '';
      if (DB.config.show_teacher_avatar) {
        if (entity.avatar) {
          avatarHtml = `<img class="profile-avatar" src="${escapeHtml(entity.avatar)}" alt="${escapeHtml(displayName)}" />`;
        } else {
          const initial = (displayName || '؟').trim().charAt(0);
          avatarHtml = `<div class="profile-avatar-fallback">${escapeHtml(initial)}</div>`;
        }
      }

      const bioText = (entity.bio || entity.description || '').trim();
      const bioHtml = bioText ? `<div class="profile-bio">${escapeHtml(bioText)}</div>` : '';

      const links = entity.links || {};
      const tiles = [];
      if (links.x) {
        tiles.push(`<a class="profile-action-tile tile-x" href="javascript:void(0)" onclick="openExternal('${escapeJs(links.x)}')">${ICONS.x}<span>ایکس</span></a>`);
      }
      if (links.facebook) {
        tiles.push(`<a class="profile-action-tile tile-fb" href="javascript:void(0)" onclick="openExternal('${escapeJs(links.facebook)}')">${ICONS.facebook}<span>فیسبوک</span></a>`);
      }
      if (links.youtube) {
        tiles.push(`<a class="profile-action-tile tile-yt" href="javascript:void(0)" onclick="openExternal('${escapeJs(links.youtube)}')">${ICONS.youtube}<span>یوتیوب</span></a>`);
      }
      tiles.push(`<button type="button" class="profile-action-tile tile-share" onclick="shareItem('${escapeJs(shareType)}', '${escapeJs(entity.id)}', '${escapeJs(displayName)}')">${ICONS.share}<span>اشتراک</span></button>`);

      return `
        <div class="profile-card">
          ${avatarHtml}
          <div class="profile-name">${escapeHtml(displayName)}</div>
          ${bioHtml}
          <div class="profile-actions-grid">${tiles.join('')}</div>
        </div>
      `;
    }

    // 4. Profile View
    function openProfileById(id) {
      const teacher = DB.teachers.find(t => t.id === id);
      if (!teacher) return;
      const cleanName = id === 'friday_sermons' ? 'خطبه‌های نماز جمعه' : teacher.name;
      pushView({ view: 'profile', teacherId: id, label: cleanName, activeTab: null, postSort: 'newest', filter: '' });
    }

    function filterItemsByQuery(items, q) {
      if (!q) return items;
      return items.filter(item =>
        normalizeText(item.title).includes(q) ||
        normalizeText(item.content).includes(q) ||
        normalizeText(item.session_topic).includes(q) ||
        normalizeText(item.summary).includes(q) ||
        normalizeText(item.macro_topic).includes(q) ||
        normalizeText(item.speaker).includes(q) ||
        (Array.isArray(item.tags) && item.tags.some(t => normalizeText(t.replace(/_/g, ' ')).includes(q)))
      );
    }

    function buildProfileBodyHtml(teacher, state) {
      const rawAssets = getTeacherAssets(teacher);
      const q = normalizeText(state.filter || '');
      const assets = {
        videos: filterItemsByQuery(rawAssets.videos, q),
        books: filterItemsByQuery(rawAssets.books, q),
        posts: filterItemsByQuery(rawAssets.posts, q)
      };

      const totalRaw = rawAssets.videos.length + rawAssets.books.length + rawAssets.posts.length;
      if (totalRaw === 0) {
        return '<div class="empty-state">به‌زودی محتوای این بخش منتشر خواهد شد.</div>';
      }

      const availableTabs = [];
      if (rawAssets.videos.length > 0) availableTabs.push({ key: 'videos', label: `ویدیوها (${toPersianDigits(assets.videos.length)})` });
      if (rawAssets.books.length > 0) availableTabs.push({ key: 'books', label: `کتاب‌ها (${toPersianDigits(assets.books.length)})` });
      if (rawAssets.posts.length > 0) availableTabs.push({ key: 'posts', label: `پست‌ها (${toPersianDigits(assets.posts.length)})` });

      if (!state.activeTab || !availableTabs.some(t => t.key === state.activeTab)) {
        state.activeTab = availableTabs.length > 0 ? availableTabs[0].key : null;
      }

      const tabsHtml = availableTabs.length > 1 ? `
        <div class="tabs-bar">
          ${availableTabs.map(t => `
            <button class="tab-btn ${state.activeTab === t.key ? 'active' : ''}" onclick="switchProfileTab('${t.key}')">${t.label}</button>
          `).join('')}
        </div>
      ` : '';

      let listHtml = '';
      if (state.activeTab === 'videos') {
        const siblings = assets.videos.filter(v => hasReadableContent(v, 'video')).map(v => ({ type: 'video', id: String(v.id) }));
        listHtml = assets.videos.length
          ? `<div class="cards-stack">${assets.videos.map(v => renderVideoCard(v, teacher.id === 'friday_sermons', siblings)).join('')}</div>`
          : '<div class="empty-state">ویدیویی با این عبارت در این بخش یافت نشد.</div>';
      } else if (state.activeTab === 'books') {
        const siblings = assets.books.filter(b => hasReadableContent(b, 'book')).map(b => ({ type: 'book', id: String(b.id) }));
        listHtml = assets.books.length
          ? `<div class="cards-stack">${assets.books.map(b => renderBookCard(b, false, siblings)).join('')}</div>`
          : '<div class="empty-state">کتابی با این عبارت در این بخش یافت نشد.</div>';
      } else if (state.activeTab === 'posts') {
        const sorted = [...assets.posts].sort((a, b) => {
          const da = a.date || '';
          const db = b.date || '';
          return state.postSort === 'oldest' ? da.localeCompare(db) : db.localeCompare(da);
        });
        const siblings = sorted.map(p => ({ type: 'post', id: String(p.id) }));
        listHtml = `
          <div class="post-sort-bar">
            <select class="post-sort-select" onchange="changePostSort(this.value)">
              <option value="newest" ${state.postSort === 'newest' ? 'selected' : ''}>مرتب‌سازی: جدیدترین</option>
              <option value="oldest" ${state.postSort === 'oldest' ? 'selected' : ''}>مرتب‌سازی: قدیمی‌ترین</option>
            </select>
          </div>
          ${sorted.length
            ? `<div class="cards-stack">${sorted.map(p => renderPostCard(p, siblings)).join('')}</div>`
            : '<div class="empty-state">پستی با این عبارت در این بخش یافت نشد.</div>'}
        `;
      }

      return tabsHtml + listHtml;
    }

    function renderProfileView(container, state) {
      const teacher = DB.teachers.find(t => t.id === state.teacherId);
      if (!teacher) return;
      const displayName = teacher.id === 'friday_sermons' ? 'خطبه‌های نماز جمعه' : teacher.name;

      container.innerHTML = `
        ${renderTelegramProfileCard(teacher, displayName, 'teacher')}
        ${renderSmartSearchBox('جستجو در آثار این بخش...', state.filter || '', 'onProfileFilterInput')}
        <div id="profileContentArea">
          ${buildProfileBodyHtml(teacher, state)}
        </div>
      `;
    }

    function onProfileFilterInput(val) {
      const state = navStack[navStack.length - 1];
      state.filter = val;
      showSmartScopeBar();
      const teacher = DB.teachers.find(t => t.id === state.teacherId);
      const box = document.getElementById('profileContentArea');
      if (teacher && box) box.innerHTML = buildProfileBodyHtml(teacher, state);
    }

    function switchProfileTab(tabKey) {
      const state = navStack[navStack.length - 1];
      state.activeTab = tabKey;
      const teacher = DB.teachers.find(t => t.id === state.teacherId);
      const box = document.getElementById('profileContentArea');
      if (teacher && box) box.innerHTML = buildProfileBodyHtml(teacher, state);
    }

    function changePostSort(val) {
      const state = navStack[navStack.length - 1];
      state.postSort = val;
      const teacher = DB.teachers.find(t => t.id === state.teacherId);
      const box = document.getElementById('profileContentArea');
      if (teacher && box) box.innerHTML = buildProfileBodyHtml(teacher, state);
    }

    // 5. Shara'i View
    function renderSharaiView(container) {
      const key = normalizeText('شرایع');
      const books = DB.books.filter(b => normalizeText(b.title).includes(key) || normalizeText(b.macro_topic).includes(key));
      const videos = DB.videos.filter(v => normalizeText(v.title).includes(key) || normalizeText(v.macro_topic).includes(key));

      let content = '';
      if (books.length === 0 && videos.length === 0) {
        content = '<div class="empty-state">به‌زودی محتوای بخش شرایع الاسلام منتشر خواهد شد.</div>';
      } else {
        const bookSiblings = books.filter(b => hasReadableContent(b, 'book')).map(b => ({ type: 'book', id: String(b.id) }));
        const videoSiblings = videos.filter(v => hasReadableContent(v, 'video')).map(v => ({ type: 'video', id: String(v.id) }));
        content = `
          <div class="cards-stack">
            ${books.map(b => renderBookCard(b, true, bookSiblings)).join('')}
            ${videos.map(v => renderVideoCard(v, true, videoSiblings)).join('')}
          </div>
        `;
      }

      container.innerHTML = `
        <div class="page-header">
          <div class="page-title">شرایع الاسلام</div>
        </div>
        ${content}
      `;
    }

    // Temporary registry for sibling lists per render (Item 4)
    let siblingRegistry = {};
    function registerSiblings(siblings) {
      if (!Array.isArray(siblings) || siblings.length <= 1) return '';
      const key = 'sib_' + Object.keys(siblingRegistry).length;
      siblingRegistry[key] = siblings;
      return key;
    }

    // Cards Renderers
    function renderBookmarkBtn(type, id) {
      const saved = isBookmarked(type, id);
      return `<button type="button" class="bookmark-icon-btn ${saved ? 'saved' : ''}" onclick="toggleBookmark('${escapeJs(type)}', '${escapeJs(id)}', this)" aria-label="نشان کردن">${saved ? ICONS.bookmarkFill : ICONS.bookmark}</button>`;
    }

    function renderVideoCard(v, showSpeaker, siblings) {
      const showCat = DB.config.show_category_on_card && v.macro_topic;
      const summary = v.session_topic || v.summary || '';
      const downloadUrl = v.pdf_url || v.telegram_link || '';
      const sibKey = registerSiblings(siblings);

      const actions = [];
      if (hasReadableContent(v, 'video')) {
        actions.push(`<button class="action-btn btn-read" onclick="openReader('video', '${escapeJs(v.id)}', '${sibKey}')">${ICONS.book}<span>مطالعه آنلاین</span></button>`);
      }
      if (downloadUrl) {
        actions.push(`<button class="action-btn btn-pdf" onclick="openExternal('${escapeJs(downloadUrl)}')">${ICONS.download}<span>دانلود PDF</span></button>`);
      }
      if (v.youtube_link) {
        actions.push(`<button class="action-btn btn-yt" onclick="openExternal('${escapeJs(v.youtube_link)}')">${ICONS.youtube}<span>ویدیوی اصلی</span></button>`);
      }
      if (v.facebook_link) {
        actions.push(`<button class="action-btn btn-fb" onclick="openExternal('${escapeJs(v.facebook_link)}')">${ICONS.facebook}<span>ویدیوی اصلی</span></button>`);
      }
      actions.push(`<button class="action-btn btn-share" onclick="shareItem('video', '${escapeJs(v.id)}', '${escapeJs(v.title)}')">${ICONS.share}<span>Share</span></button>`);

      return `
        <div class="content-card">
          <div class="card-header-row">
            <div class="card-title">${escapeHtml(v.title)}</div>
            ${renderBookmarkBtn('video', v.id)}
          </div>
          ${showSpeaker && v.speaker ? `<div class="card-speaker">${escapeHtml(v.speaker)}</div>` : ''}
          ${showCat ? `<div class="card-cat">${escapeHtml(v.macro_topic)}</div>` : ''}
          ${summary ? `<div class="card-summary">${escapeHtml(summary)}</div>` : ''}
          <div class="card-actions">${actions.join('')}</div>
        </div>
      `;
    }

    function renderBookCard(b, showSpeaker, siblings) {
      const showCat = DB.config.show_category_on_card && b.macro_topic;
      const summary = b.summary || '';
      const downloadUrl = b.pdf_url || b.telegram_link || '';
      const sibKey = registerSiblings(siblings);

      const actions = [];
      if (hasReadableContent(b, 'book')) {
        actions.push(`<button class="action-btn btn-read" onclick="openReader('book', '${escapeJs(b.id)}', '${sibKey}')">${ICONS.book}<span>مطالعه آنلاین</span></button>`);
      }
      if (downloadUrl) {
        actions.push(`<button class="action-btn btn-pdf" onclick="openExternal('${escapeJs(downloadUrl)}')">${ICONS.download}<span>دانلود PDF</span></button>`);
      }
      actions.push(`<button class="action-btn btn-share" onclick="shareItem('book', '${escapeJs(b.id)}', '${escapeJs(b.title)}')">${ICONS.share}<span>Share</span></button>`);

      return `
        <div class="content-card">
          <div class="card-header-row">
            <div class="card-title">${escapeHtml(b.title)}</div>
            ${renderBookmarkBtn('book', b.id)}
          </div>
          ${showSpeaker && b.speaker ? `<div class="card-speaker">${escapeHtml(b.speaker)}</div>` : ''}
          ${showCat ? `<div class="card-cat">${escapeHtml(b.macro_topic)}</div>` : ''}
          ${summary ? `<div class="card-summary">${escapeHtml(summary)}</div>` : ''}
          <div class="card-actions">${actions.join('')}</div>
        </div>
      `;
    }

    function renderPostCard(p, siblings) {
      const preview = p.content || p.title || 'برای مشاهده متن کامل کلیک کنید...';
      const sibKey = registerSiblings(siblings);
      return `
        <div class="content-card">
          <div class="card-header-row">
            <div class="post-date">${p.date ? toPersianDigits(p.date) : ''}</div>
            ${renderBookmarkBtn('post', p.id)}
          </div>
          <div class="post-preview">${escapeHtml(preview)}</div>
          <div class="post-footer">
            <button class="action-btn btn-share" style="padding: 7px 12px;" onclick="shareItem('post', '${escapeJs(p.id)}', '${escapeJs(p.title || preview.slice(0, 60))}')">${ICONS.share}<span>Share</span></button>
            <button class="action-btn btn-read" style="flex:0 1 auto; padding: 8px 16px;" onclick="openReader('post', '${escapeJs(p.id)}', '${sibKey}')">${ICONS.book}<span>مطالعه آنلاین</span></button>
          </div>
        </div>
      `;
    }

    // Single Item Detail View for Deep Links (Item 5)
    function renderItemDetailView(container, state) {
      const item = findItemByTypeAndId(state.itemType, state.itemId);
      if (!item) {
        container.innerHTML = '<div class="empty-state">اثر مورد نظر یافت نشد.</div>';
        return;
      }

      let cardHtml = '';
      if (state.itemType === 'video') cardHtml = renderVideoCard(item, true);
      else if (state.itemType === 'book') cardHtml = renderBookCard(item, true);
      else if (state.itemType === 'post') cardHtml = renderPostCard(item);

      let teacherBtnHtml = '';
      if (item.speaker) {
        const teacher = DB.teachers.find(t =>
          (item.teacher_id && t.id === item.teacher_id) ||
          getTeacherMatchNames(t).includes(normalizeText(item.speaker))
        );
        if (teacher) {
          teacherBtnHtml = `
            <div style="margin-top: 14px;">
              <button class="home-btn" style="width:100%; min-height:54px; padding:12px;" onclick="openProfileById('${escapeJs(teacher.id)}')">
                <span>مشاهده سایر آثار ${escapeHtml(teacher.name)}</span>
              </button>
            </div>
          `;
        }
      }

      container.innerHTML = `
        <div class="cards-stack">${cardHtml}</div>
        ${teacherBtnHtml}
      `;
    }

    // 6. Reading Mode (Items 4, 6, 9)
    function openReader(type, id, sibKey) {
      const item = findItemByTypeAndId(type, id);
      if (!item) return;
      const siblings = (sibKey && siblingRegistry[sibKey]) ? siblingRegistry[sibKey] : [];
      pushView({
        view: 'reader',
        itemType: type,
        itemId: String(id),
        siblings: siblings,
        label: 'مطالعه آنلاین'
      });
    }

    function navigateReaderSibling(direction) {
      const state = navStack[navStack.length - 1];
      if (!state || state.view !== 'reader' || !Array.isArray(state.siblings)) return;
      const idx = state.siblings.findIndex(s => s.type === state.itemType && String(s.id) === String(state.itemId));
      const nextIdx = idx + direction;
      if (idx < 0 || nextIdx < 0 || nextIdx >= state.siblings.length) return;

      stopActiveAudio();
      const target = state.siblings[nextIdx];
      state.itemType = target.type;
      state.itemId = target.id;
      renderCurrentView();
      window.scrollTo(0, 0);
    }

    function parseTimeToSeconds(val) {
      if (typeof val === 'number' && !isNaN(val)) return val;
      if (!val) return 0;
      const str = String(val).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).trim();
      const parts = str.split(':').map(Number);
      if (parts.some(isNaN)) return 0;
      if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
      if (parts.length === 2) return parts[0] * 60 + parts[1];
      return parts[0] || 0;
    }

    function formatSeconds(sec) {
      if (!sec || isNaN(sec)) return '00:00';
      const s = Math.floor(sec % 60);
      const m = Math.floor((sec / 60) % 60);
      const h = Math.floor(sec / 3600);
      const pad = n => String(n).padStart(2, '0');
      return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
    }

    async function renderReaderView(container, state) {
      stopActiveAudio();
      const item = findItemByTypeAndId(state.itemType, state.itemId);
      if (!item) {
        container.innerHTML = '<div class="empty-state">مطلب مورد نظر یافت نشد.</div>';
        return;
      }

      const title = item.title || '';
      currentReaderTitleForCopy = title;
      currentReaderTextForCopy = '';

      const metaParts = [];
      if (item.speaker) metaParts.push(item.speaker);
      if (item.date) metaParts.push(`تاریخ: ${toPersianDigits(item.date)}`);
      const metaStr = metaParts.join(' • ');

      const sourceBtns = [];
      if (item.source_x) sourceBtns.push(`<a class="social-btn btn-x" href="javascript:void(0)" onclick="openExternal('${escapeJs(item.source_x)}')">${ICONS.x}<span>منبع: X</span></a>`);
      if (item.source_facebook) sourceBtns.push(`<a class="social-btn btn-fb" href="javascript:void(0)" onclick="openExternal('${escapeJs(item.source_facebook)}')">${ICONS.facebook}<span>منبع: Facebook</span></a>`);
      if (item.youtube_link) sourceBtns.push(`<a class="social-btn btn-yt" href="javascript:void(0)" onclick="openExternal('${escapeJs(item.youtube_link)}')">${ICONS.youtube}<span>ویدیوی اصلی</span></a>`);

      // Prev / Next Bar (Item 4)
      let prevNextHtml = '';
      if (Array.isArray(state.siblings) && state.siblings.length > 1) {
        const idx = state.siblings.findIndex(s => s.type === state.itemType && String(s.id) === String(state.itemId));
        if (idx >= 0) {
          const typeLabel = state.itemType === 'video' ? 'ویدیوی' : (state.itemType === 'book' ? 'کتاب' : 'پست');
          const hasPrev = idx > 0;
          const hasNext = idx < state.siblings.length - 1;
          prevNextHtml = `
            <div class="reader-nav-row">
              <button class="reader-nav-btn" ${hasPrev ? '' : 'disabled'} onclick="navigateReaderSibling(-1)">
                ${ICONS.chevronRight}<span>${typeLabel} قبلی</span>
              </button>
              <button class="reader-nav-btn" ${hasNext ? '' : 'disabled'} onclick="navigateReaderSibling(1)">
                <span>${typeLabel} بعدی</span>${ICONS.chevronLeft}
              </button>
            </div>
          `;
        }
      }

      // Sticky Audio Bar placeholder (Item 9)
      const audioHtml = item.audio_url ? `
        <div class="audio-sticky-bar" id="audioStickyBar">
          <div class="audio-controls-row">
            <button type="button" class="audio-play-btn" id="audioPlayBtn" aria-label="پخش یا توقف">${ICONS.play}</button>
            <div class="audio-progress-wrap">
              <input type="range" id="audioSeek" class="audio-seek" min="0" max="100" value="0" step="0.1" />
              <div class="audio-times">
                <span id="audioCurrTime">00:00</span>
                <span id="audioDurTime">00:00</span>
              </div>
            </div>
            <button type="button" class="audio-mini-btn" id="audioSpeedBtn">1x</button>
            <button type="button" class="audio-mini-btn" id="toggleArBtn" style="display:none;">عربی</button>
          </div>
        </div>
      ` : '';

      container.innerHTML = `
        <div class="reader-wrap">
          <div class="reader-header-row">
            ${title ? `<div class="reader-title">${escapeHtml(title)}</div>` : '<div style="flex:1;"></div>'}
            ${renderBookmarkBtn(state.itemType, state.itemId)}
          </div>
          ${metaStr ? `<div class="reader-meta">${escapeHtml(metaStr)}</div>` : ''}
          ${audioHtml}
          <div id="readerBody" class="reader-body">در حال بارگذاری متن...</div>
          <div class="reader-footer">
            <div class="social-row">${sourceBtns.join('')}</div>
            <div class="reader-footer-actions">
              <button class="action-btn btn-copy" onclick="copyReaderFullText('${escapeJs(state.itemType)}', '${escapeJs(state.itemId)}')">${ICONS.copy}<span>کپی متن</span></button>
              <button class="action-btn btn-share" onclick="shareItem('${escapeJs(state.itemType)}', '${escapeJs(state.itemId)}', '${escapeJs(title || 'مطالعه آنلاین')}')">${ICONS.share}<span>Share</span></button>
            </div>
          </div>
          ${prevNextHtml}
        </div>
      `;

      const bodyEl = document.getElementById('readerBody');

      // Load Synced Audio-Text if sync_file exists (Item 9)
      let segments = [];
      if (item.sync_file) {
        try {
          const res = await fetch(`${item.sync_file}?v=${Date.now()}`);
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
              segments = data.map(seg => ({
                time: parseTimeToSeconds(seg.time),
                fa: seg.fa || seg.text || '',
                ar: seg.ar || ''
              })).sort((a, b) => a.time - b.time);
            }
          }
        } catch (e) { /* fallback below */ }
      }

      if (segments.length > 0) {
        const hasArabic = segments.some(s => s.ar && s.ar.trim());
        bodyEl.className = 'sync-list';
        bodyEl.innerHTML = segments.map((seg, i) => `
          <div class="sync-segment" data-seg-idx="${i}" data-seg-time="${seg.time}">
            <div class="sync-time-badge">${formatSeconds(seg.time)}</div>
            ${seg.ar ? `<div class="sync-ar">${escapeHtml(seg.ar)}</div>` : ''}
            <div class="sync-fa">${escapeHtml(seg.fa)}</div>
          </div>
        `).join('');
        currentReaderTextForCopy = segments.map(s => s.fa).join('\n\n');

        if (hasArabic) {
          const arBtn = document.getElementById('toggleArBtn');
          if (arBtn) {
            arBtn.style.display = 'inline-block';
            arBtn.onclick = () => {
              const active = bodyEl.classList.toggle('show-ar');
              arBtn.classList.toggle('active', active);
            };
          }
        }
      } else if (item.text_file) {
        try {
          const res = await fetch(`${item.text_file}?v=${Date.now()}`);
          if (!res.ok) throw new Error('not found');
          const txt = await res.text();
          bodyEl.textContent = txt;
          currentReaderTextForCopy = txt;
        } catch (e) {
          bodyEl.textContent = item.content || 'خطا در بارگذاری فایل متنی.';
          currentReaderTextForCopy = bodyEl.textContent;
        }
      } else {
        bodyEl.textContent = item.content || 'متنی برای نمایش ثبت نشده است.';
        currentReaderTextForCopy = bodyEl.textContent;
      }

      // Wire up Audio Player & Sync Engine
      if (item.audio_url) {
        initReaderAudio(item.audio_url, segments);
      }
    }

    function initReaderAudio(audioUrl, segments) {
      const audio = new Audio(audioUrl);
      activeAudio = audio;

      const playBtn = document.getElementById('audioPlayBtn');
      const seekEl = document.getElementById('audioSeek');
      const currEl = document.getElementById('audioCurrTime');
      const durEl = document.getElementById('audioDurTime');
      const speedBtn = document.getElementById('audioSpeedBtn');

      const speeds = [1, 1.25, 1.5, 2, 0.75];
      let speedIdx = 0;
      let activeSegIdx = -1;

      if (playBtn) {
        playBtn.onclick = () => {
          if (audio.paused) {
            audio.play().catch(() => showToast('خطا در پخش فایل صوتی'));
          } else {
            audio.pause();
          }
        };
      }

      if (speedBtn) {
        speedBtn.onclick = () => {
          speedIdx = (speedIdx + 1) % speeds.length;
          audio.playbackRate = speeds[speedIdx];
          speedBtn.textContent = speeds[speedIdx] + 'x';
        };
      }

      audio.addEventListener('play', () => {
        if (playBtn) playBtn.innerHTML = ICONS.pause;
      });
      audio.addEventListener('pause', () => {
        if (playBtn) playBtn.innerHTML = ICONS.play;
      });
      audio.addEventListener('loadedmetadata', () => {
        if (seekEl && audio.duration) seekEl.max = audio.duration;
        if (durEl) durEl.textContent = formatSeconds(audio.duration);
      });

      if (seekEl) {
        seekEl.addEventListener('input', () => {
          audio.currentTime = Number(seekEl.value);
        });
      }

      // Tap-to-Seek on synced segments
      if (segments.length > 0) {
        document.querySelectorAll('.sync-segment').forEach(el => {
          el.addEventListener('click', () => {
            const t = Number(el.getAttribute('data-seg-time')) || 0;
            audio.currentTime = t;
            if (audio.paused) {
              audio.play().catch(() => {});
            }
          });
        });
      }

      audio.addEventListener('timeupdate', () => {
        if (seekEl) seekEl.value = audio.currentTime;
        if (currEl) currEl.textContent = formatSeconds(audio.currentTime);

        if (segments.length > 0) {
          let newIdx = -1;
          for (let i = segments.length - 1; i >= 0; i--) {
            if (audio.currentTime >= segments[i].time) {
              newIdx = i;
              break;
            }
          }
          if (newIdx !== activeSegIdx) {
            const prevEl = document.querySelector(`.sync-segment[data-seg-idx="${activeSegIdx}"]`);
            if (prevEl) prevEl.classList.remove('active');
            activeSegIdx = newIdx;
            const nextEl = document.querySelector(`.sync-segment[data-seg-idx="${activeSegIdx}"]`);
            if (nextEl) {
              nextEl.classList.add('active');
              if (!audio.paused) {
                nextEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
              }
            }
          }
        }
      });
    }

    // 7. Categories View
    function renderCategoriesView(container) {
      const catMap = {};
      DB.videos.forEach(v => {
        if (v.macro_topic) catMap[v.macro_topic] = (catMap[v.macro_topic] || 0) + 1;
      });
      DB.books.forEach(b => {
        if (b.macro_topic) catMap[b.macro_topic] = (catMap[b.macro_topic] || 0) + 1;
      });

      const cats = Object.keys(catMap).sort((a, b) => catMap[b] - catMap[a]);
      const cards = cats.map(c => `
        <div class="entity-card" onclick="pushView({ view: 'category_detail', category: '${escapeJs(c)}', label: '${escapeJs(c)}', filter: '' })">
          <div class="entity-name">${escapeHtml(c)}</div>
          <div class="entity-meta">${toPersianDigits(catMap[c])} اثر</div>
        </div>
      `).join('');

      container.innerHTML = `
        <div class="page-header">
          <div class="page-title">دسته‌بندی موضوعی</div>
        </div>
        <div class="entity-list">
          ${cards || '<div class="empty-state">دسته‌بندی ثبت نشده است.</div>'}
        </div>
      `;
    }

    function buildCategoryDetailHtml(cat, filterVal) {
      const q = normalizeText(filterVal || '');
      const videos = filterItemsByQuery(DB.videos.filter(v => v.macro_topic === cat), q);
      const books = filterItemsByQuery(DB.books.filter(b => b.macro_topic === cat), q);
      const videoSiblings = videos.filter(v => hasReadableContent(v, 'video')).map(v => ({ type: 'video', id: String(v.id) }));
      const bookSiblings = books.filter(b => hasReadableContent(b, 'book')).map(b => ({ type: 'book', id: String(b.id) }));

      const html = videos.map(v => renderVideoCard(v, true, videoSiblings)).join('') +
                   books.map(b => renderBookCard(b, true, bookSiblings)).join('');
      return html || '<div class="empty-state">موردی در این دسته‌بندی یافت نشد.</div>';
    }

    function renderCategoryDetail(container, state) {
      container.innerHTML = `
        <div class="page-header">
          <div class="page-title">${escapeHtml(state.category)}</div>
        </div>
        ${renderSmartSearchBox('جستجو در این دسته‌بندی...', state.filter || '', 'onCategoryFilterInput')}
        <div class="cards-stack" id="categoryDetailResults">
          ${buildCategoryDetailHtml(state.category, state.filter || '')}
        </div>
      `;
    }

    function onCategoryFilterInput(val) {
      const state = navStack[navStack.length - 1];
      state.filter = val;
      showSmartScopeBar();
      const box = document.getElementById('categoryDetailResults');
      if (box) box.innerHTML = buildCategoryDetailHtml(state.category, val);
    }

    // 8. Bookmarks View (Item 7)
    function renderBookmarksView(container) {
      const saved = getBookmarks();
      const cards = [];
      const postSiblings = [];
      const videoSiblings = [];
      const bookSiblings = [];

      saved.forEach(entry => {
        const item = findItemByTypeAndId(entry.type, entry.id);
        if (!item) return;
        if (entry.type === 'post') postSiblings.push({ type: 'post', id: String(item.id) });
        if (entry.type === 'video' && hasReadableContent(item, 'video')) videoSiblings.push({ type: 'video', id: String(item.id) });
        if (entry.type === 'book' && hasReadableContent(item, 'book')) bookSiblings.push({ type: 'book', id: String(item.id) });
      });

      saved.forEach(entry => {
        const item = findItemByTypeAndId(entry.type, entry.id);
        if (!item) return;
        if (entry.type === 'video') cards.push(renderVideoCard(item, true, videoSiblings));
        else if (entry.type === 'book') cards.push(renderBookCard(item, true, bookSiblings));
        else if (entry.type === 'post') cards.push(renderPostCard(item, postSiblings));
      });

      container.innerHTML = `
        <div class="page-header">
          <div class="page-title">نشان‌شده‌ها</div>
        </div>
        ${cards.length
          ? `<div class="cards-stack">${cards.join('')}</div>`
          : '<div class="empty-state">هنوز مطلبی نشان نکرده‌اید. با لمس آیکون نشان روی هر کارت یا صفحه مطالعه، می‌توانید آن را اینجا ذخیره کنید.</div>'}
      `;
    }

    // 9. Global Search View
    function buildGlobalSearchResultsHtml(queryVal) {
      const q = normalizeText(queryVal || '');
      if (!q) {
        return '<div class="empty-state">عبارت مورد نظر خود را برای جستجو در کل آرشیو بنویسید.</div>';
      }

      let resultsHtml = '';
      const matchedTeachers = DB.teachers.filter(t =>
        t.type !== 'group' && (
          normalizeText(t.name).includes(q) ||
          (t.aliases && t.aliases.some(a => normalizeText(a).includes(q)))
        )
      );
      const matchedVideos = filterItemsByQuery(DB.videos, q);
      const matchedBooks = filterItemsByQuery(DB.books, q);
      const matchedPosts = filterItemsByQuery(DB.posts, q);

      if (matchedTeachers.length) {
        resultsHtml += `<div class="section-label">اساتید (${toPersianDigits(matchedTeachers.length)})</div>`;
        resultsHtml += `<div class="entity-list">${matchedTeachers.map(t => `
          <div class="entity-card" onclick="openProfileById('${escapeJs(t.id)}')">
            <div class="entity-name">${escapeHtml(t.name)}</div>
            <div class="entity-meta">${formatAssetCounts(getTeacherAssets(t))}</div>
          </div>
        `).join('')}</div>`;
      }
      if (matchedVideos.length) {
        const sibs = matchedVideos.filter(v => hasReadableContent(v, 'video')).map(v => ({ type: 'video', id: String(v.id) }));
        resultsHtml += `<div class="section-label">ویدیوها (${toPersianDigits(matchedVideos.length)})</div>`;
        resultsHtml += `<div class="cards-stack">${matchedVideos.map(v => renderVideoCard(v, true, sibs)).join('')}</div>`;
      }
      if (matchedBooks.length) {
        const sibs = matchedBooks.filter(b => hasReadableContent(b, 'book')).map(b => ({ type: 'book', id: String(b.id) }));
        resultsHtml += `<div class="section-label">کتاب‌ها (${toPersianDigits(matchedBooks.length)})</div>`;
        resultsHtml += `<div class="cards-stack">${matchedBooks.map(b => renderBookCard(b, true, sibs)).join('')}</div>`;
      }
      if (matchedPosts.length) {
        const sibs = matchedPosts.map(p => ({ type: 'post', id: String(p.id) }));
        resultsHtml += `<div class="section-label">پست‌ها (${toPersianDigits(matchedPosts.length)})</div>`;
        resultsHtml += `<div class="cards-stack">${matchedPosts.map(p => renderPostCard(p, sibs)).join('')}</div>`;
      }
      return resultsHtml || '<div class="empty-state">نتیجه‌ای یافت نشد.</div>';
    }

    function renderSearchView(container, state) {
      container.innerHTML = `
        <div class="search-box">
          ${ICONS.search}
          <input type="text" id="globalSearchInput" placeholder="جستجو در عنوان، استاد، موضوع و کلیدواژه‌ها..." value="${escapeHtml(state.query || '')}" oninput="updateGlobalSearch(this.value)" />
        </div>
        <div id="globalSearchResults">
          ${buildGlobalSearchResultsHtml(state.query || '')}
        </div>
      `;
      const inp = document.getElementById('globalSearchInput');
      if (inp) {
        inp.focus();
        inp.setSelectionRange(inp.value.length, inp.value.length);
      }
    }

    function updateGlobalSearch(val) {
      navStack[navStack.length - 1].query = val;
      const box = document.getElementById('globalSearchResults');
      if (box) box.innerHTML = buildGlobalSearchResultsHtml(val);
    }

    // Initialization & Batch Post Files (Item 1) + Deep Link Fix (Item 5)
    async function safeFetchJson(url, fallback) {
      try {
        const res = await fetch(`${url}?v=${Date.now()}`);
        if (!res.ok) return fallback;
        return await res.json();
      } catch (e) {
        return fallback;
      }
    }

    function extractStartParam() {
      if (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
        return tg.initDataUnsafe.start_param;
      }
      const searchParams = new URLSearchParams(window.location.search);
      const fromSearch = searchParams.get('tgWebAppStartParam') || searchParams.get('startapp');
      if (fromSearch) return fromSearch;

      if (window.location.hash && window.location.hash.length > 1) {
        const hashParams = new URLSearchParams(window.location.hash.slice(1));
        const fromHash = hashParams.get('tgWebAppStartParam') || hashParams.get('startapp');
        if (fromHash) return fromHash;
      }
      return null;
    }

    function handleDeepLink() {
      const startParam = extractStartParam();
      if (!startParam) return;

      const [type, ...rest] = startParam.split('_');
      const id = rest.join('_');
      if (!id) return;

      if (type === 'video' || type === 'book') {
        const item = findItemByTypeAndId(type, id);
        if (item) {
          pushView({
            view: 'item_detail',
            itemType: type,
            itemId: String(id),
            label: type === 'video' ? 'مشاهده ویدیو' : 'مشاهده کتاب'
          });
        }
      } else if (type === 'post') {
        const post = findItemByTypeAndId('post', id);
        if (post) openReader('post', id);
      } else if (type === 'teacher') {
        openProfileById(id);
      } else if (type === 'group') {
        openGroupById(id);
      }
    }

    async function init() {
      const config = await safeFetchJson('config.json', DB.config);
      DB.config = Object.assign(DB.config, config);

      const postFileList = Array.isArray(DB.config.post_files) ? DB.config.post_files : [];

      const [teachers, videos, books, legacyPosts, ...batchPostsArrays] = await Promise.all([
        safeFetchJson('teachers.json', []),
        safeFetchJson('data.json', []),
        safeFetchJson('books.json', []),
        safeFetchJson('posts.json', []),
        ...postFileList.map(path => safeFetchJson(path, []))
      ]);

      DB.teachers = Array.isArray(teachers) ? teachers : [];
      DB.videos = Array.isArray(videos) ? videos : [];
      DB.books = Array.isArray(books) ? books : [];

      // Merge posts.json + posts/*.json and deduplicate by id
      const mergedPosts = [];
      const seenPostIds = new Set();
      const allPostSources = [
        ...(Array.isArray(legacyPosts) ? legacyPosts : []),
        ...batchPostsArrays.flatMap(arr => (Array.isArray(arr) ? arr : []))
      ];
      allPostSources.forEach(p => {
        if (!p || p.id === undefined || p.id === null) return;
        const pid = String(p.id);
        if (!seenPostIds.has(pid)) {
          seenPostIds.add(pid);
          mergedPosts.push(p);
        }
      });
      DB.posts = mergedPosts;

      navStack = [{ view: 'home', label: 'خانه', scrollY: 0 }];
      renderCurrentView();
      handleDeepLink();
    }

    init();
  </script>
